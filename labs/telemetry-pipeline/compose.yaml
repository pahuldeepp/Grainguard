services:
  kafka:
    image: apache/kafka@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_SSL,CONTROLLER:SASL_SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: ${KAFKA_BROKER_JAAS:?run prepare.py}
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: ${KAFKA_BROKER_JAAS:?run prepare.py}
      KAFKA_SSL_KEYSTORE_LOCATION: /run/kafka/server.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_KEYSTORE_PASSWORD:?run prepare.py}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_KEYSTORE_PASSWORD:?run prepare.py}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /run/kafka/truststore.p12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TRUSTSTORE_PASSWORD:?run prepare.py}
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - ../../.local/telemetry-pipeline/kafka:/run/kafka:ro
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 --command-config /run/kafka/broker.properties >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  kafka-init:
    image: apache/kafka@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    profiles: [init]
    depends_on:
      kafka: {condition: service_healthy}
    volumes:
      - ../../.local/telemetry-pipeline/kafka:/run/kafka:ro
    entrypoint: ["/bin/bash", "-ec"]
    command: ["/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --command-config /run/kafka/publisher.properties --create --if-not-exists --topic greenguard.telemetry.recorded.v1 --partitions 1 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --command-config /run/kafka/publisher.properties --create --if-not-exists --topic greenguard.telemetry.recorded.v2 --partitions 1 --replication-factor 1"]

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:157423fca52f596b62a1bf301b037b9f74bfca38089aa57d1bd36c9025f7ecef
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run prepare.py}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ../../infra/gitops/disposable/clickhouse-chart/files/telemetry.sql:/docker-entrypoint-initdb.d/01-telemetry.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [CMD-SHELL, "clickhouse-client --user default --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?run prepare.py}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?run prepare.py}
    volumes:
      - minio-data:/data

  minio-init:
    build:
      context: ../..
      dockerfile: services/telemetry-sinks/deploy/Dockerfile
    profiles: [init]
    depends_on:
      minio: {condition: service_started}
    environment:
      MINIO_USER: ${MINIO_USER:?run prepare.py}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?run prepare.py}
      TELEMETRY_ARCHIVE_BUCKET: ${TELEMETRY_ARCHIVE_BUCKET:?run prepare.py}
    volumes:
      - ./minio_init.py:/lab/minio_init.py:ro
    entrypoint: ["python", "/lab/minio_init.py"]

  telemetry-clickhouse-sink:
    build:
      context: ../..
      dockerfile: services/telemetry-sinks/deploy/Dockerfile
    command: ["clickhouse"]
    depends_on:
      clickhouse: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment: &sink
      PYTHONPATH: /app
      KAFKA_BROKERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: clickhouse
      KAFKA_SASL_PASSWORD: ${KAFKA_CLICKHOUSE_PASSWORD:?run prepare.py}
      KAFKA_TLS_CA_FILE: /run/kafka/ca.crt
      EVENT_SCHEMA_DIR: /contracts/events
      HEALTH_PORT: "8080"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run prepare.py}
    volumes:
      - ../../.local/telemetry-pipeline/kafka/ca.crt:/run/kafka/ca.crt:ro
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8080/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  telemetry-archive:
    build:
      context: ../..
      dockerfile: services/telemetry-sinks/deploy/Dockerfile
    entrypoint: ["python", "/lab/run_archive.py"]
    depends_on:
      minio: {condition: service_started}
      kafka: {condition: service_healthy}
    environment:
      <<: *sink
      KAFKA_SASL_USERNAME: archive
      KAFKA_SASL_PASSWORD: ${KAFKA_ARCHIVE_PASSWORD:?run prepare.py}
      TELEMETRY_ARCHIVE_BUCKET: ${TELEMETRY_ARCHIVE_BUCKET:?run prepare.py}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_USER:?run prepare.py}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?run prepare.py}
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../../.local/telemetry-pipeline/kafka/ca.crt:/run/kafka/ca.crt:ro
      - ./run_archive.py:/lab/run_archive.py:ro
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8080/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  publisher:
    build:
      context: ../..
      dockerfile: services/telemetry-sinks/deploy/Dockerfile
    profiles: [tools]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      PYTHONPATH: /app
      KAFKA_BROKERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: publisher
      KAFKA_SASL_PASSWORD: ${KAFKA_PUBLISHER_PASSWORD:?run prepare.py}
      KAFKA_TLS_CA_FILE: /run/kafka/ca.crt
      EVENT_SCHEMA_DIR: /contracts/events
    volumes:
      - ../../.local/telemetry-pipeline/kafka/ca.crt:/run/kafka/ca.crt:ro
      - ./publish.py:/lab/publish.py:ro
    entrypoint: ["python", "/lab/publish.py"]

  acceptance:
    build:
      context: ../..
      dockerfile: services/telemetry-sinks/deploy/Dockerfile
    profiles: [tools]
    environment:
      PYTHONPATH: /app
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run prepare.py}
      TELEMETRY_ARCHIVE_BUCKET: ${TELEMETRY_ARCHIVE_BUCKET:?run prepare.py}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_USER:?run prepare.py}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?run prepare.py}
      S3_ENDPOINT_URL: http://minio:9000
      EXPECTED_ARCHIVE_OBJECTS: ${EXPECTED_ARCHIVE_OBJECTS:-1}
    volumes:
      - ./acceptance.py:/lab/acceptance.py:ro
    entrypoint: ["python", "/lab/acceptance.py"]

volumes:
  kafka-data:
  clickhouse-data:
  minio-data:
