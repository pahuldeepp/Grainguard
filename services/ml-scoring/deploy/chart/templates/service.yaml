{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ml-scoring.name" . }}
  labels:
    {{- include "ml-scoring.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "ml-scoring.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: health
      port: {{ .Values.health.port }}
      targetPort: health
{{- end }}
