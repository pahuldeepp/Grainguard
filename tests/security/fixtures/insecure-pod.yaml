apiVersion: v1
kind: Pod
metadata:
  name: intentionally-insecure-fixture
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:latest
      securityContext:
        privileged: true
        runAsUser: 0
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
