name: Optional Flink risk verification
on:
  pull_request:
    paths:
      [
        "services/risk-engine/**",
        "services/stream-processor/**",
        "services/workflow-alerts/**",
        "scripts/flink-*.mjs",
        "scripts/stage06-e2e.mjs",
        "infra/flink/**",
        ".github/workflows/flink-risk.yml",
      ]
  workflow_dispatch:
    inputs:
      run_live:
        description: Run disposable Flink and notification fault tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: flink-risk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: make flink-test
      - run: node --test scripts/flink-risk-helpers.test.mjs
      - run: npx eslint scripts/flink-*.mjs scripts/stage06-e2e.mjs
      - name: Check optional monitoring rules
        run: docker run --rm --network none --entrypoint /bin/promtool -v "$PWD/infra/flink:/rules:ro" -w /rules prom/prometheus@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62 test rules risk-prometheus-rules.test.yml
  live:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: services/jobs-worker/go.mod }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with: { python-version: "3.13" }
      - run: node scripts/flink-risk-ci.mjs up
      - name: Retain integration evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flink-risk-live
          path: evidence/flink/risk-integration*.json
          if-no-files-found: error
      - name: Stop only this runner's test project
        if: always()
        run: node scripts/flink-risk-ci.mjs down
