name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Required quality gate
    runs-on: ubuntu-latest
    # make verify, coverage, smoke and the staging build alone take about 35 minutes on this
    # runner; SonarQube analysis after that needs real headroom, not just the minutes left over.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/telemetry-ingest/go.mod
          cache-dependency-path: |
            services/telemetry-ingest/go.sum
            services/cdc-transformer/go.sum
            services/projection-builder/go.sum
            services/jobs-worker/go.sum
            services/saga-orchestrator/go.sum
            services/hardware-service/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            infra/cdk/requirements.txt
            services/eventbridge-bridge/requirements.txt
      - run: make bootstrap
      - run: make verify
      - name: Test and synthesize optional critical-alert AWS profile
        run: make stage10b-serverless-test cdk-synth
      - name: Prove read-role tenant isolation against PostgreSQL
        run: READ_MODEL_LIVE=1 node --env-file=.env --test packages/read-model/dist/index.test.js
      - run: npm audit --audit-level=high
      - run: make coverage
      - run: make smoke
      - name: Build and verify container staging
        run: make staging
      - name: Release disposable staging images before SonarQube
        run: |
          make staging-down
          make db-down
          docker image prune -af
          # SonarQube's embedded Elasticsearch refuses to allocate shards above the 90 % disk
          # watermark and then stops itself (run 36303038336 had 6.3 % free). Image pruning alone
          # leaves the staging build cache and the runner's preinstalled SDKs. Only SDKs outside
          # the runner-managed toolcache that no step of this job uses are removed (.NET, Android,
          # GHC); /opt/hostedtoolcache is left untouched, including the setup-* toolcaches the
          # remaining steps' post actions use.
          df -h .
          docker builder prune -af
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
      - name: Start isolated SonarQube
        run: make sonar-up sonar-init
      - name: Analyze coverage and enforce SonarQube gate
        run: make sonar-scan
      - name: Verify every coverage artifact exists
        run: |
          for report in \
            coverage/go.out \
            coverage/cdc-transformer.out \
            coverage/projection-builder.out \
            coverage/cassandra-writer.out \
            coverage/kafka-transport.out \
            coverage/go-common.out \
            coverage/go-migrations.out \
            coverage/jobs-worker.out \
            coverage/saga-orchestrator.out \
            coverage/hardware-service.out \
            coverage/sonar-quality-gate.json \
            apps/dashboard/coverage/lcov.info \
            services/bff/coverage/lcov.info \
            services/read-api/coverage/lcov.info \
            services/device-service/coverage/lcov.info \
            services/workflow-alerts/coverage/lcov.info \
            services/notification-service/coverage/lcov.info \
            services/tenant-control-plane/coverage/lcov.info \
            services/billing-service/coverage/lcov.info \
            packages/membership-client/coverage/lcov.info \
            packages/feature-flags/coverage/lcov.info \
            packages/entitlements/coverage/lcov.info \
            packages/audit/coverage/lcov.info \
            packages/read-model/coverage/lcov.info \
            services/search-indexer/coverage.xml \
            services/risk-engine/coverage.xml; do
            test -f "$report" || { echo "::error file=$report::Missing coverage artifact"; exit 1; }
          done
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/go.out
            coverage/cdc-transformer.out
            coverage/projection-builder.out
            coverage/cassandra-writer.out
            coverage/kafka-transport.out
            coverage/go-common.out
            coverage/go-migrations.out
            coverage/sonar-quality-gate.json
            apps/dashboard/coverage/lcov.info
            services/bff/coverage/lcov.info
            services/read-api/coverage/lcov.info
            services/device-service/coverage/lcov.info
            services/workflow-alerts/coverage/lcov.info
            services/notification-service/coverage/lcov.info
            services/tenant-control-plane/coverage/lcov.info
            services/billing-service/coverage/lcov.info
            packages/membership-client/coverage/lcov.info
            packages/feature-flags/coverage/lcov.info
            packages/entitlements/coverage/lcov.info
            packages/audit/coverage/lcov.info
            coverage/jobs-worker.out
            coverage/saga-orchestrator.out
            coverage/hardware-service.out
            packages/read-model/coverage/lcov.info
            services/search-indexer/coverage.xml
            services/risk-engine/coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Stop isolated test environments
        if: always()
        run: |
          make staging-down
          make db-down
          make sonar-down
  publish:
    name: Publish verified images
    needs:
      [
        quality,
        events-integration,
        redis-integration,
        oidc-integration,
        oidc-browser-integration,
        history-integration,
        search-integration,
        stage06-integration,
        stage07-integration,
        stage08-integration,
        mysql-cdc-integration,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: dashboard
            dockerfile: apps/dashboard/Dockerfile
          - service: device-service
            dockerfile: services/device-service/Dockerfile
          - service: telemetry-ingest
            dockerfile: services/telemetry-ingest/Dockerfile
          - service: gateway
            dockerfile: services/gateway/Dockerfile
          - service: bff
            dockerfile: services/bff/Dockerfile
          - service: read-api
            dockerfile: services/read-api/Dockerfile
          - service: workflow-alerts
            dockerfile: services/workflow-alerts/Dockerfile
          - service: cdc-transformer
            dockerfile: services/cdc-transformer/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable commit images
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pahuldeepp/grainguard/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

  mysql-cdc-integration:
    name: MySQL snapshot and CDC integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/mysql-cdc/requirements.txt
      - run: make bootstrap
      - run: make mysql-cdc-test
      - name: Stop opt-in source and event stack
        if: always()
        run: |
          if test -f .env && test -f .local/mysql-cdc.env; then
            docker compose --env-file .env --env-file .local/mysql-cdc.env -f infra/compose/compose.yaml -f infra/kafka/compose.yaml -f infra/mysql-cdc/compose.yaml stop mysql-cdc connect schema-registry kafka
          fi
          make db-down

  redis-integration:
    name: Redis cache and failover integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/telemetry-ingest/go.mod
          cache-dependency-path: |
            services/telemetry-ingest/go.sum
            services/projection-builder/go.sum
            services/hardware-service/go.sum
            services/cassandra-writer/go.sum
      - run: make bootstrap
      - run: make redis-up
      - run: make redis-test
      - name: Stop Redis infrastructure
        if: always()
        run: make redis-down

  oidc-integration:
    name: OIDC authentication integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/telemetry-ingest/go.mod
          cache-dependency-path: |
            services/telemetry-ingest/go.sum
            services/projection-builder/go.sum
            services/hardware-service/go.sum
            services/cassandra-writer/go.sum
      - run: make bootstrap
      - run: make db-up projection-migrate cassandra-up search-up
      - run: make oidc-up
      - run: make oidc-test
      - name: Stop OIDC infrastructure
        if: always()
        run: |
          make oidc-down
          make search-down
          make cassandra-down
          make db-down

  oidc-browser-integration:
    name: OIDC Chromium browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/telemetry-ingest/go.mod
          cache-dependency-path: |
            services/telemetry-ingest/go.sum
            services/projection-builder/go.sum
            services/hardware-service/go.sum
            services/cassandra-writer/go.sum
      - run: make bootstrap
      - name: Install locked Playwright Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - run: make db-up projection-migrate cassandra-up search-up
      - run: make oidc-up
      - run: make oidc-browser-test
      - name: Stop browser OIDC infrastructure
        if: always()
        run: |
          make oidc-down
          make search-down
          make cassandra-down
          make db-down

  stage08-integration:
    name: Gateway and dashboard end-to-end integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/saga-orchestrator/go.mod
          cache-dependency-path: |
            services/saga-orchestrator/go.sum
            services/hardware-service/go.sum
            services/telemetry-ingest/go.sum
            services/cdc-transformer/go.sum
            services/projection-builder/go.sum
            services/cassandra-writer/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/search-indexer/requirements.txt
      - run: make bootstrap
      - name: Build Stage 08 runtime images from clean checkout
        run: |
          docker build -f services/gateway/Dockerfile -t "greenguard-ci-gateway:${GITHUB_SHA}" .
          docker build -f services/bff/Dockerfile -t "greenguard-ci-bff:${GITHUB_SHA}" .
          docker build -f services/read-api/Dockerfile -t "greenguard-ci-read-api:${GITHUB_SHA}" .
          docker build -f services/workflow-alerts/Dockerfile -t "greenguard-ci-alerts:${GITHUB_SHA}" .
      - name: Install locked Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Start event, history, search, cache, MQTT, and OIDC services
        run: |
          make events-up
          docker compose --env-file .env -f infra/compose/compose.yaml -f infra/kafka/compose.yaml up -d --wait mosquitto
          make cassandra-up search-up redis-up oidc-up
          python3 -m venv .local/search-venv
          .local/search-venv/bin/pip install -r services/search-indexer/requirements.txt
      - name: Run real browser through the gateway
        run: make browser-e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage08-browser-${{ github.sha }}
          path: evidence/stage08-e2e/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop Stage 08 services
        if: always()
        run: |
          make oidc-down || true
          make redis-down || true
          make search-down || true
          make cassandra-down || true
          make events-down || true
          make db-down || true

  events-integration:
    name: Event backbone integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/telemetry-ingest/go.mod
          cache-dependency-path: services/telemetry-ingest/go.sum
      - run: make bootstrap
      - run: make events-up
      - run: make events-test
      - run: make events-e2e
      - run: make events-faults
      - name: Stop event infrastructure
        if: always()
        run: make events-down

  history-integration:
    name: Cassandra history and fault integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/cassandra-writer/go.mod
          cache-dependency-path: services/cassandra-writer/go.sum
      - run: make bootstrap
      - run: make events-up cassandra-up
      - run: make history-test
      - name: Stop history infrastructure
        if: always()
        run: |
          make cassandra-down
          make events-down

  search-integration:
    name: Search index and Kafka integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/telemetry-ingest/go.mod
          cache-dependency-path: services/telemetry-ingest/go.sum
      - run: make bootstrap
      - run: make search-test
      - name: Stop search infrastructure
        if: always()
        run: |
          make search-down
          make events-down

  stage06-integration:
    name: Risk, alert, and delivery integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/jobs-worker/go.mod
          cache-dependency-path: |
            services/jobs-worker/go.sum
            services/cdc-transformer/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/risk-engine/requirements-dev.txt
      - run: make bootstrap
      - run: npm run build -w services/workflow-alerts -w services/notification-service
      - run: make events-up rabbitmq-up
      - run: make jobs-migrate
      - run: make rabbitmq-test
      - run: node scripts/stage06-connect.mjs
      - run: node scripts/stage06-e2e.mjs
      - name: Stop Stage 06 infrastructure
        if: always()
        run: |
          make rabbitmq-down
          make events-down

  stage07-integration:
    name: Saga and physical sensor integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/saga-orchestrator/go.mod
          cache-dependency-path: |
            services/saga-orchestrator/go.sum
            services/hardware-service/go.sum
            services/telemetry-ingest/go.sum
            services/cdc-transformer/go.sum
      - run: make bootstrap
      - run: make stage07-e2e
      - name: Stop Stage 07 infrastructure
        if: always()
        run: |
          docker compose --env-file .env -f infra/compose/compose.yaml -f infra/kafka/compose.yaml stop mosquitto
          make events-down
          make db-down
