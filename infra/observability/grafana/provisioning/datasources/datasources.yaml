apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "1m"
        spanEndTimeShift: "1m"
        tags: [{ key: service.name, value: service_name }]
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "1m"
        spanEndTimeShift: "1m"
        tags: [{ key: service.name, value: job }]
      nodeGraph:
        enabled: true
      search:
        hide: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
