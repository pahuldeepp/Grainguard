stream_over_http_enabled: true
query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+08
  trace_by_id:
    duration_slo: 5s
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    pool:
      max_workers: 20
      queue_depth: 100
