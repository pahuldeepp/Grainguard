# Generated from a compact spec; annotations are copied from rules/brokers.yaml.
"rule_files":
  - "../rules/brokers.yaml"
"evaluation_interval": "1m"
"tests":
  - "name": "KafkaBrokerUnavailable pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'up{job="kafka-exporter",instance="kafka-exporter:9308"}'
        "values": "1x20"
      - "series": 'kafka_brokers{job="kafka-exporter"}'
        "values": "0x20"
    "alert_rule_test":
      - "eval_time": "1m"
        "alertname": "KafkaBrokerUnavailable"
        "exp_alerts": []
      - "eval_time": "3m"
        "alertname": "KafkaBrokerUnavailable"
        "exp_alerts":
          - "exp_labels":
              "severity": "page"
            "exp_annotations":
              "summary": "Kafka has no reachable broker"
              "description": "The healthy Kafka exporter reports zero brokers. Threshold is the single local broker; raise it to the cell broker count in production."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "KafkaBrokerUnavailable silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'up{job="kafka-exporter",instance="kafka-exporter:9308"}'
        "values": "1x20"
      - "series": 'kafka_brokers{job="kafka-exporter"}'
        "values": "1x20"
    "alert_rule_test":
      - "eval_time": "10m"
        "alertname": "KafkaBrokerUnavailable"
        "exp_alerts": []
  - "name": "KafkaExporterTargetDown fires when the target is down"
    "interval": "1m"
    "input_series":
      - "series": 'up{job="kafka-exporter",instance="kafka-exporter:9308"}'
        "values": "0x20"
    "alert_rule_test":
      - "eval_time": "4m"
        "alertname": "KafkaExporterTargetDown"
        "exp_alerts": []
      - "eval_time": "7m"
        "alertname": "KafkaExporterTargetDown"
        "exp_alerts":
          - "exp_labels":
              "severity": "ticket"
            "exp_annotations":
              "summary": "Kafka broker telemetry is unavailable"
              "description": "The kafka-exporter target or broker-count metric is missing or down; broker health is unknown until telemetry recovers."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "KafkaExporterTargetDown fires when telemetry is absent"
    "interval": "1m"
    "alert_rule_test":
      - "eval_time": "7m"
        "alertname": "KafkaExporterTargetDown"
        "exp_alerts":
          - "exp_labels":
              "job": "kafka-exporter"
              "severity": "ticket"
            "exp_annotations":
              "summary": "Kafka broker telemetry is unavailable"
              "description": "The kafka-exporter target or broker-count metric is missing or down; broker health is unknown until telemetry recovers."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "KafkaBrokerUnavailable stays silent when the exporter is down"
    "interval": "1m"
    "input_series":
      - "series": 'up{job="kafka-exporter",instance="kafka-exporter:9308"}'
        "values": "0x20"
    "alert_rule_test":
      - "eval_time": "7m"
        "alertname": "KafkaBrokerUnavailable"
        "exp_alerts": []
  - "name": "KafkaExporterTargetDown fires when broker metric is absent"
    "interval": "1m"
    "input_series":
      - "series": 'up{job="kafka-exporter",instance="kafka-exporter:9308"}'
        "values": "1x20"
    "alert_rule_test":
      - "eval_time": "7m"
        "alertname": "KafkaExporterTargetDown"
        "exp_alerts":
          - "exp_labels":
              "severity": "ticket"
            "exp_annotations":
              "summary": "Kafka broker telemetry is unavailable"
              "description": "The kafka-exporter target or broker-count metric is missing or down; broker health is unknown until telemetry recovers."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "KafkaOfflinePartitions pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_topic_partition_leader{topic="greenguard.raw.telemetry.outbox",partition="0"}'
        "values": "-1x10"
    "alert_rule_test":
      - "eval_time": "30s"
        "alertname": "KafkaOfflinePartitions"
        "exp_alerts": []
      - "eval_time": "3m"
        "alertname": "KafkaOfflinePartitions"
        "exp_alerts":
          - "exp_labels":
              "severity": "page"
              "topic": "greenguard.raw.telemetry.outbox"
            "exp_annotations":
              "summary": "A Kafka partition has no leader"
              "description": "At least one partition of the topic reports leader -1, so producers and consumers of that partition are blocked."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "KafkaOfflinePartitions silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_topic_partition_leader{topic="greenguard.raw.telemetry.outbox",partition="0"}'
        "values": "1x10"
    "alert_rule_test":
      - "eval_time": "5m"
        "alertname": "KafkaOfflinePartitions"
        "exp_alerts": []
  - "name": "KafkaUnderReplicatedPartitions pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_topic_partition_under_replicated_partition{topic="greenguard.raw.telemetry.outbox",partition="0"}'
        "values": "1x20"
    "alert_rule_test":
      - "eval_time": "4m"
        "alertname": "KafkaUnderReplicatedPartitions"
        "exp_alerts": []
      - "eval_time": "7m"
        "alertname": "KafkaUnderReplicatedPartitions"
        "exp_alerts":
          - "exp_labels":
              "severity": "ticket"
              "topic": "greenguard.raw.telemetry.outbox"
            "exp_annotations":
              "summary": "Kafka partitions are under-replicated"
              "description": "In-sync replicas are below the replica count for at least one partition of the topic."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "KafkaUnderReplicatedPartitions silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_topic_partition_under_replicated_partition{topic="greenguard.raw.telemetry.outbox",partition="0"}'
        "values": "0x20"
    "alert_rule_test":
      - "eval_time": "10m"
        "alertname": "KafkaUnderReplicatedPartitions"
        "exp_alerts": []
  - "name": "KafkaConsumerGroupLagHigh pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_consumergroup_lag_sum{consumergroup="greenguard-cdc-transformer-v1",topic="greenguard.raw.telemetry.outbox"}'
        "values": "5000x40"
    "alert_rule_test":
      - "eval_time": "9m"
        "alertname": "KafkaConsumerGroupLagHigh"
        "exp_alerts": []
      - "eval_time": "12m"
        "alertname": "KafkaConsumerGroupLagHigh"
        "exp_alerts":
          - "exp_labels":
              "severity": "ticket"
              "consumergroup": "greenguard-cdc-transformer-v1"
              "topic": "greenguard.raw.telemetry.outbox"
            "exp_annotations":
              "summary": "A durable Kafka consumer group is behind"
              "description": "Lag summed over partitions stayed above 1000 records for ten minutes. The threshold is a candidate until measured under load (Stage 13)."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "KafkaConsumerGroupLagHigh silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_consumergroup_lag_sum{consumergroup="greenguard-cdc-transformer-v1",topic="greenguard.raw.telemetry.outbox"}'
        "values": "10x40"
    "alert_rule_test":
      - "eval_time": "20m"
        "alertname": "KafkaConsumerGroupLagHigh"
        "exp_alerts": []
  - "name": "KafkaConsumerGroupStalled pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_consumergroup_lag_sum{consumergroup="greenguard-cdc-transformer-v1",topic="greenguard.raw.telemetry.outbox"}'
        "values": "50x60"
      - "series": 'kafka_consumergroup_current_offset_sum{consumergroup="greenguard-cdc-transformer-v1",topic="greenguard.raw.telemetry.outbox"}'
        "values": "1000x60"
    "alert_rule_test":
      - "eval_time": "8m"
        "alertname": "KafkaConsumerGroupStalled"
        "exp_alerts": []
      - "eval_time": "14m"
        "alertname": "KafkaConsumerGroupStalled"
        "exp_alerts":
          - "exp_labels":
              "severity": "page"
              "consumergroup": "greenguard-cdc-transformer-v1"
              "topic": "greenguard.raw.telemetry.outbox"
            "exp_annotations":
              "summary": "A durable Kafka consumer group has lag and is not advancing"
              "description": "The group has pending records and its committed offset did not move for ten minutes; the consumer may be crash-looping, fenced or blocked on a downstream dependency."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "KafkaConsumerGroupStalled silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_consumergroup_lag_sum{consumergroup="greenguard-cdc-transformer-v1",topic="greenguard.raw.telemetry.outbox"}'
        "values": "50x60"
      - "series": 'kafka_consumergroup_current_offset_sum{consumergroup="greenguard-cdc-transformer-v1",topic="greenguard.raw.telemetry.outbox"}'
        "values": "1000+10x60"
    "alert_rule_test":
      - "eval_time": "40m"
        "alertname": "KafkaConsumerGroupStalled"
        "exp_alerts": []
  - "name": "KafkaConsumerGroupNoMembers pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_consumergroup_members{consumergroup="greenguard-cdc-transformer-v1"}'
        "values": "0x30"
      - "series": 'kafka_consumergroup_lag_sum{consumergroup="greenguard-cdc-transformer-v1",topic="greenguard.raw.telemetry.outbox"}'
        "values": "50x30"
    "alert_rule_test":
      - "eval_time": "4m"
        "alertname": "KafkaConsumerGroupNoMembers"
        "exp_alerts": []
      - "eval_time": "7m"
        "alertname": "KafkaConsumerGroupNoMembers"
        "exp_alerts":
          - "exp_labels":
              "severity": "page"
              "consumergroup": "greenguard-cdc-transformer-v1"
            "exp_annotations":
              "summary": "A durable Kafka consumer group has no members while records are pending"
              "description": "No consumer is joined to the group but it has unconsumed records; the service is down or cannot reach the broker."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "KafkaConsumerGroupNoMembers silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_consumergroup_members{consumergroup="greenguard-cdc-transformer-v1"}'
        "values": "1x30"
      - "series": 'kafka_consumergroup_lag_sum{consumergroup="greenguard-cdc-transformer-v1",topic="greenguard.raw.telemetry.outbox"}'
        "values": "50x30"
    "alert_rule_test":
      - "eval_time": "15m"
        "alertname": "KafkaConsumerGroupNoMembers"
        "exp_alerts": []
  - "name": "KafkaTopicRetainedMessagesHigh pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_topic_partition_current_offset{topic="greenguard.raw.telemetry.outbox",partition="0"}'
        "values": "20000000x60"
      - "series": 'kafka_topic_partition_oldest_offset{topic="greenguard.raw.telemetry.outbox",partition="0"}'
        "values": "0x60"
    "alert_rule_test":
      - "eval_time": "28m"
        "alertname": "KafkaTopicRetainedMessagesHigh"
        "exp_alerts": []
      - "eval_time": "35m"
        "alertname": "KafkaTopicRetainedMessagesHigh"
        "exp_alerts":
          - "exp_labels":
              "severity": "ticket"
              "topic": "greenguard.raw.telemetry.outbox"
            "exp_annotations":
              "summary": "A Kafka topic retains an unusually large number of records"
              "description": "Retained records (latest offset minus oldest offset) exceed ten million. Candidate threshold, unmeasured; the exporter exposes offsets, not bytes, so confirm disk use with the log-dir check in the runbook."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "KafkaTopicRetainedMessagesHigh silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'kafka_topic_partition_current_offset{topic="greenguard.raw.telemetry.outbox",partition="0"}'
        "values": "1000x60"
      - "series": 'kafka_topic_partition_oldest_offset{topic="greenguard.raw.telemetry.outbox",partition="0"}'
        "values": "0x60"
    "alert_rule_test":
      - "eval_time": "45m"
        "alertname": "KafkaTopicRetainedMessagesHigh"
        "exp_alerts": []
  - "name": "BindingFeedAgeWarning pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'binding_feed_age_seconds{job="telemetry-ingest"}'
        "values": "90x20"
    "alert_rule_test":
      - "eval_time": "1m"
        "alertname": "BindingFeedAgeWarning"
        "exp_alerts": []
      - "eval_time": "4m"
        "alertname": "BindingFeedAgeWarning"
        "exp_alerts":
          - "exp_labels":
              "severity": "ticket"
              "job": "telemetry-ingest"
            "exp_annotations":
              "summary": "Binding feed checkpoints are aging"
              "description": "Binding feed age is between 60 and 240 seconds. New readings are rejected with binding_feed_stale at the 5 minute bound (ADR-0009, R7)."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "BindingFeedAgeWarning silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'binding_feed_age_seconds{job="telemetry-ingest"}'
        "values": "5x20"
    "alert_rule_test":
      - "eval_time": "10m"
        "alertname": "BindingFeedAgeWarning"
        "exp_alerts": []
  - "name": "BindingFeedAgeCritical fires for +Inf age after its for-duration"
    "interval": "1m"
    "input_series":
      - "series": 'binding_feed_age_seconds{job="telemetry-ingest"}'
        "values": "inf inf inf inf inf inf"
    "alert_rule_test":
      - "eval_time": "30s"
        "alertname": "BindingFeedAgeCritical"
        "exp_alerts": []
      - "eval_time": "3m"
        "alertname": "BindingFeedAgeCritical"
        "exp_alerts":
          - "exp_labels":
              "severity": "page"
              "job": "telemetry-ingest"
            "exp_annotations":
              "summary": "Binding feed is about to block ingest"
              "description": "Binding feed age exceeds 240 seconds or evidence is missing (+Inf); ingest fails closed with 503 binding_feed_stale at 300 seconds (ADR-0009, R7)."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "BindingFeedAgeCritical fires for 300s age"
    "interval": "1m"
    "input_series":
      - "series": 'binding_feed_age_seconds{job="telemetry-ingest"}'
        "values": "300x10"
    "alert_rule_test":
      - "eval_time": "3m"
        "alertname": "BindingFeedAgeCritical"
        "exp_alerts":
          - "exp_labels":
              "severity": "page"
              "job": "telemetry-ingest"
            "exp_annotations":
              "summary": "Binding feed is about to block ingest"
              "description": "Binding feed age exceeds 240 seconds or evidence is missing (+Inf); ingest fails closed with 503 binding_feed_stale at 300 seconds (ADR-0009, R7)."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "BindingFeedAgeCritical silent at 200s age (warning band only)"
    "interval": "1m"
    "input_series":
      - "series": 'binding_feed_age_seconds{job="telemetry-ingest"}'
        "values": "200x10"
    "alert_rule_test":
      - "eval_time": "5m"
        "alertname": "BindingFeedAgeCritical"
        "exp_alerts": []
  - "name": "BindingFeedAgeCritical silent when fresh"
    "interval": "1m"
    "input_series":
      - "series": 'binding_feed_age_seconds{job="telemetry-ingest"}'
        "values": "5x10"
    "alert_rule_test":
      - "eval_time": "5m"
        "alertname": "BindingFeedAgeCritical"
        "exp_alerts": []
  - "name": "BindingConsumerQuarantine pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'binding_consumer_quarantine_total{job="telemetry-ingest",reason="heartbeat"}'
        "values": "0+1x20"
    "alert_rule_test":
      - "eval_time": "8m"
        "alertname": "BindingConsumerQuarantine"
        "exp_alerts":
          - "exp_labels":
              "severity": "ticket"
              "reason": "heartbeat"
            "exp_annotations":
              "summary": "Binding feed checkpoints are being quarantined"
              "description": "The telemetry binding consumer quarantined malformed or database-rejected checkpoints; inspect the quarantine envelope reason."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "BindingConsumerQuarantine silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'binding_consumer_quarantine_total{job="telemetry-ingest",reason="heartbeat"}'
        "values": "0x20"
    "alert_rule_test":
      - "eval_time": "10m"
        "alertname": "BindingConsumerQuarantine"
        "exp_alerts": []
  - "name": "BindingFeedClockSkew pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'binding_feed_clock_skew_total{job="telemetry-ingest"}'
        "values": "0+1x20"
    "alert_rule_test":
      - "eval_time": "8m"
        "alertname": "BindingFeedClockSkew"
        "exp_alerts":
          - "exp_labels":
              "severity": "ticket"
              "job": "telemetry-ingest"
            "exp_annotations":
              "summary": "Binding feed source and ingest clocks disagree"
              "description": "Future-dated checkpoints were clamped to ingest time; repair clock synchronisation."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "BindingFeedClockSkew silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'binding_feed_clock_skew_total{job="telemetry-ingest"}'
        "values": "3x20"
    "alert_rule_test":
      - "eval_time": "10m"
        "alertname": "BindingFeedClockSkew"
        "exp_alerts": []
  - "name": "CDCQuarantinedRecords pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'cdc_quarantined_total{job="cdc-transformer",reason="schema"}'
        "values": "0+1x20"
    "alert_rule_test":
      - "eval_time": "8m"
        "alertname": "CDCQuarantinedRecords"
        "exp_alerts":
          - "exp_labels":
              "severity": "ticket"
              "reason": "schema"
            "exp_annotations":
              "summary": "The CDC transformer is quarantining records"
              "description": "Records failed canonical validation and were published to quarantine; each needs an explicit disposition."
              "runbook_url": "docs/runbooks/kafka-consumer-lag.md"
  - "name": "CDCQuarantinedRecords silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'cdc_quarantined_total{job="cdc-transformer",reason="schema"}'
        "values": "0x20"
    "alert_rule_test":
      - "eval_time": "10m"
        "alertname": "CDCQuarantinedRecords"
        "exp_alerts": []
  - "name": "KafkaConnectUnreachable pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'greenguard_connect_up{job="kafka-connect-state"}'
        "values": "0x20"
    "alert_rule_test":
      - "eval_time": "1m"
        "alertname": "KafkaConnectUnreachable"
        "exp_alerts": []
      - "eval_time": "3m"
        "alertname": "KafkaConnectUnreachable"
        "exp_alerts":
          - "exp_labels":
              "severity": "page"
              "job": "kafka-connect-state"
            "exp_annotations":
              "summary": "Kafka Connect REST API is unreachable"
              "description": "The connect state exporter cannot read the Connect REST API; CDC connector state is unknown and may be stopped."
              "runbook_url": "docs/runbooks/kafka-connect-failed.md"
  - "name": "KafkaConnectUnreachable silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'greenguard_connect_up{job="kafka-connect-state"}'
        "values": "1x20"
    "alert_rule_test":
      - "eval_time": "10m"
        "alertname": "KafkaConnectUnreachable"
        "exp_alerts": []
  - "name": "KafkaConnectConnectorFailed pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'greenguard_connect_connector_state{connector="inventory-outbox",state="FAILED"}'
        "values": "1x20"
    "alert_rule_test":
      - "eval_time": "30s"
        "alertname": "KafkaConnectConnectorFailed"
        "exp_alerts": []
      - "eval_time": "2m"
        "alertname": "KafkaConnectConnectorFailed"
        "exp_alerts":
          - "exp_labels":
              "severity": "page"
              "connector": "inventory-outbox"
              "state": "FAILED"
            "exp_annotations":
              "summary": "A Debezium connector is FAILED"
              "description": "The connector is in the FAILED state, so committed outbox rows are not being captured while WAL is retained."
              "runbook_url": "docs/runbooks/kafka-connect-failed.md"
  - "name": "KafkaConnectConnectorFailed silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'greenguard_connect_connector_state{connector="inventory-outbox",state="FAILED"}'
        "values": "0x20"
    "alert_rule_test":
      - "eval_time": "10m"
        "alertname": "KafkaConnectConnectorFailed"
        "exp_alerts": []
  - "name": "KafkaConnectTaskFailed pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'greenguard_connect_task_state{connector="inventory-outbox",state="FAILED"}'
        "values": "1x20"
    "alert_rule_test":
      - "eval_time": "30s"
        "alertname": "KafkaConnectTaskFailed"
        "exp_alerts": []
      - "eval_time": "2m"
        "alertname": "KafkaConnectTaskFailed"
        "exp_alerts":
          - "exp_labels":
              "severity": "page"
              "connector": "inventory-outbox"
              "state": "FAILED"
            "exp_annotations":
              "summary": "A Debezium connector task is FAILED"
              "description": "At least one task of the connector is FAILED even if the connector itself reports RUNNING."
              "runbook_url": "docs/runbooks/kafka-connect-failed.md"
  - "name": "KafkaConnectTaskFailed silent when healthy"
    "interval": "1m"
    "input_series":
      - "series": 'greenguard_connect_task_state{connector="inventory-outbox",state="FAILED"}'
        "values": "0x20"
    "alert_rule_test":
      - "eval_time": "10m"
        "alertname": "KafkaConnectTaskFailed"
        "exp_alerts": []
  - "name": "KafkaConnectConnectorPaused pending before its for-duration, then fires"
    "interval": "1m"
    "input_series":
      - "series": 'greenguard_connect_connector_state{connector="inventory-outbox",state="PAUSED"}'
        "values": "1x40"
    "alert_rule_test":
      - "eval_time": "14m"
        "alertname": "KafkaConnectConnectorPaused"
        "exp_alerts": []
      - "eval_time": "17m"
        "alertname": "KafkaConnectConnectorPaused"
        "exp_alerts":
          - "exp_labels":
              "severity": "ticket"
              "connector": "inventory-outbox"
              "state": "PAUSED"
            "exp_annotations":
              "summary": "A Debezium connector has been paused or stopped"
              "description": "The connector was paused or stopped for fifteen minutes; WAL keeps accumulating behind its replication slot."
              "runbook_url": "docs/runbooks/kafka-connect-failed.md"
  - "name": "KafkaConnectConnectorPaused silent when healthy"
