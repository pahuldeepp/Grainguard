# Failure-rehearsal stack: Prometheus + Alertmanager only. Config files are
# generated by scripts/observability-rehearsal.mjs into .generated/.
name: greenguard-obs-rehearsal
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?Run make observability-rehearse}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./.generated/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.generated/rules:/etc/prometheus/rules:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${REHEARSAL_PROM_PORT:-29090}:9090"]
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?Run make observability-rehearse}
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./.generated/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${REHEARSAL_AM_PORT:-29093}:9093"]
