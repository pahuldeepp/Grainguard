# Custom queries for a second postgres_exporter instance (compose profile "brokers").
# Mirrors scripts/wal-check.mjs: retained bytes are measured from the slot's restart_lsn.
# pg_replication_slots is a cluster-wide view; the connecting role needs pg_monitor.
# Metric names are <query>_<column>: pg_wal_slot_active, pg_wal_slot_retained_bytes,
# pg_wal_slot_cap_bytes, pg_wal_slot_status_degraded, labelled by database and slot_name.
pg_wal_slot:
  query: >-
    SELECT COALESCE(database, '') AS database,
    slot_name,
    active::int AS active,
    COALESCE(pg_wal_lsn_diff(confirmed_flush_lsn, '0/0'::pg_lsn), 0)::float8 AS confirmed_flush_position_bytes,
    COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn), 0)::float8 AS retained_bytes,
    CASE WHEN current_setting('max_slot_wal_keep_size') = '-1' THEN -1
    ELSE pg_size_bytes(current_setting('max_slot_wal_keep_size')) END::float8 AS cap_bytes,
    (wal_status IN ('unreserved', 'lost'))::int AS status_degraded
    FROM pg_replication_slots
    WHERE slot_type = 'logical'
  master: true
  metrics:
    - database:
        usage: LABEL
        description: Database the slot belongs to
    - slot_name:
        usage: LABEL
        description: Replication slot name
    - active:
        usage: GAUGE
        description: 1 when a walsender is attached to the slot
    - confirmed_flush_position_bytes:
        usage: GAUGE
        description: Confirmed flush LSN converted to a byte position for progress tracking
    - retained_bytes:
        usage: GAUGE
        description: WAL bytes between the current LSN and the slot restart_lsn
    - cap_bytes:
        usage: GAUGE
        description: max_slot_wal_keep_size in bytes, -1 when unbounded
    - status_degraded:
        usage: GAUGE
        description: 1 when wal_status is unreserved or lost
