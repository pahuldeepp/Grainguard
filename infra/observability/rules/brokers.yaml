# Stage 11 streaming-backbone rules: Kafka, Kafka Connect/Debezium, replication slots, RabbitMQ.
# Labels are bounded (topic, consumergroup, connector, queue, slot); never tenant/device/event IDs.
# Durable-consumer allowlist: the dev stack accumulates hundreds of ephemeral test consumer groups,
# so lag alerts cover only these named groups. Keep the regex in sync with each new long-lived consumer.
groups:
  - name: broker-recording
    interval: 1m
    rules:
      - record: kafka:consumergroup_lag:sum
        expr: kafka_consumergroup_lag_sum{consumergroup=~"greenguard-cdc-transformer-v1|telemetry-binding-consumer|projection-builder|cassandra-writer|greenguard-cache-invalidator-v1|greenguard-inventory-saga-v1|greenguard-notifications-flags-v1|telemetry-saga-binding-v1|greenguard\\.hardware\\.v1|greenguard-connect"}
      - record: kafka:consumergroup_progress:increase10m
        expr: increase(kafka_consumergroup_current_offset_sum{consumergroup=~"greenguard-cdc-transformer-v1|telemetry-binding-consumer|projection-builder|cassandra-writer|greenguard-cache-invalidator-v1|greenguard-inventory-saga-v1|greenguard-notifications-flags-v1|telemetry-saga-binding-v1|greenguard\\.hardware\\.v1|greenguard-connect"}[10m])
      - record: kafka:topic_retained_messages:sum
        expr: sum by (topic) (kafka_topic_partition_current_offset - kafka_topic_partition_oldest_offset)
  - name: broker-alerts
    rules:
      - alert: KafkaBrokerUnavailable
        expr: sum(up{job="kafka-exporter"}) > 0 and sum(kafka_brokers{job="kafka-exporter"}) < 1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Kafka has no reachable broker"
          description: "The healthy Kafka exporter reports zero brokers. Threshold is the single local broker; raise it to the cell broker count in production."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: KafkaExporterTargetDown
        expr: sum(up{job="kafka-exporter"}) == 0 or absent(up{job="kafka-exporter"}) or (sum(up{job="kafka-exporter"}) > 0 and on() absent(kafka_brokers{job="kafka-exporter"}))
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Kafka broker telemetry is unavailable"
          description: "The kafka-exporter target or broker-count metric is missing or down; broker health is unknown until telemetry recovers."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: KafkaOfflinePartitions
        expr: count by (topic) (kafka_topic_partition_leader < 0) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "A Kafka partition has no leader"
          description: "At least one partition of the topic reports leader -1, so producers and consumers of that partition are blocked."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: KafkaUnderReplicatedPartitions
        expr: sum by (topic) (kafka_topic_partition_under_replicated_partition) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Kafka partitions are under-replicated"
          description: "In-sync replicas are below the replica count for at least one partition of the topic."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: KafkaConsumerGroupLagHigh
        expr: kafka:consumergroup_lag:sum > 1000
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "A durable Kafka consumer group is behind"
          description: "Lag summed over partitions stayed above 1000 records for ten minutes. The threshold is a candidate until measured under load (Stage 13)."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: KafkaConsumerGroupStalled
        expr: |
          kafka:consumergroup_lag:sum > 0 and on (consumergroup, topic) kafka:consumergroup_progress:increase10m == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "A durable Kafka consumer group has lag and is not advancing"
          description: "The group has pending records and its committed offset did not move for ten minutes; the consumer may be crash-looping, fenced or blocked on a downstream dependency."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: KafkaConsumerGroupNoMembers
        expr: |
          kafka_consumergroup_members{consumergroup=~"greenguard-cdc-transformer-v1|telemetry-binding-consumer|projection-builder|cassandra-writer|greenguard-cache-invalidator-v1|greenguard-inventory-saga-v1|greenguard-notifications-flags-v1|telemetry-saga-binding-v1|greenguard\\.hardware\\.v1|greenguard-connect"} == 0 and on (consumergroup) sum by (consumergroup) (kafka:consumergroup_lag:sum) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "A durable Kafka consumer group has no members while records are pending"
          description: "No consumer is joined to the group but it has unconsumed records; the service is down or cannot reach the broker."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: KafkaTopicRetainedMessagesHigh
        expr: kafka:topic_retained_messages:sum > 10000000
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "A Kafka topic retains an unusually large number of records"
          description: "Retained records (latest offset minus oldest offset) exceed ten million. Candidate threshold, unmeasured; the exporter exposes offsets, not bytes, so confirm disk use with the log-dir check in the runbook."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: BindingFeedAgeWarning
        expr: binding_feed_age_seconds > 60 and binding_feed_age_seconds <= 240
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "Binding feed checkpoints are aging"
          description: "Binding feed age is between 60 and 240 seconds. New readings are rejected with binding_feed_stale at the 5 minute bound (ADR-0009, R7)."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: BindingFeedAgeCritical
        expr: binding_feed_age_seconds > 240
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Binding feed is about to block ingest"
          description: "Binding feed age exceeds 240 seconds or evidence is missing (+Inf); ingest fails closed with 503 binding_feed_stale at 300 seconds (ADR-0009, R7)."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: BindingConsumerQuarantine
        expr: sum by (reason) (increase(binding_consumer_quarantine_total[5m])) > 0
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "Binding feed checkpoints are being quarantined"
          description: "The telemetry binding consumer quarantined malformed or database-rejected checkpoints; inspect the quarantine envelope reason."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: BindingFeedClockSkew
        expr: increase(binding_feed_clock_skew_total[5m]) > 0
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "Binding feed source and ingest clocks disagree"
          description: "Future-dated checkpoints were clamped to ingest time; repair clock synchronisation."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: CDCQuarantinedRecords
        expr: sum by (reason) (increase(cdc_quarantined_total[10m])) > 0
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "The CDC transformer is quarantining records"
          description: "Records failed canonical validation and were published to quarantine; each needs an explicit disposition."
          runbook_url: "docs/runbooks/kafka-consumer-lag.md"
      - alert: KafkaConnectUnreachable
        expr: greenguard_connect_up == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Kafka Connect REST API is unreachable"
          description: "The connect state exporter cannot read the Connect REST API; CDC connector state is unknown and may be stopped."
          runbook_url: "docs/runbooks/kafka-connect-failed.md"
      - alert: KafkaConnectConnectorFailed
        expr: greenguard_connect_connector_state{state="FAILED"} == 1
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "A Debezium connector is FAILED"
          description: "The connector is in the FAILED state, so committed outbox rows are not being captured while WAL is retained."
          runbook_url: "docs/runbooks/kafka-connect-failed.md"
      - alert: KafkaConnectTaskFailed
        expr: greenguard_connect_task_state{state="FAILED"} > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "A Debezium connector task is FAILED"
          description: "At least one task of the connector is FAILED even if the connector itself reports RUNNING."
          runbook_url: "docs/runbooks/kafka-connect-failed.md"
      - alert: KafkaConnectConnectorPaused
        expr: greenguard_connect_connector_state{state=~"PAUSED|STOPPED"} == 1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "A Debezium connector has been paused or stopped"
          description: "The connector was paused or stopped for fifteen minutes; WAL keeps accumulating behind its replication slot."
          runbook_url: "docs/runbooks/kafka-connect-failed.md"
      - alert: SchemaRegistryDown
        expr: greenguard_schema_registry_up == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Schema Registry is unreachable"
          description: "The state exporter cannot read the Schema Registry subjects endpoint; canonical producers and consumers that need schemas will fail."
          runbook_url: "docs/runbooks/kafka-connect-failed.md"
      - alert: ReplicationSlotInactive
        expr: pg_wal_slot_active == 0
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "A logical replication slot is inactive"
          description: "No walsender is attached to the slot, so PostgreSQL retains WAL for it (docs/WAL_RETENTION.md)."
          runbook_url: "docs/runbooks/kafka-replication-slot.md"
      - alert: ReplicationSlotInactiveCritical
        expr: pg_wal_slot_active == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "A logical replication slot has been inactive for five minutes"
          description: "The Debezium consumer is not attached and WAL is growing toward max_slot_wal_keep_size."
          runbook_url: "docs/runbooks/kafka-replication-slot.md"
      - alert: ReplicationSlotWALRetainedWarning
        expr: |
          pg_wal_slot_retained_bytes / (pg_wal_slot_cap_bytes > 0) > 0.5 and pg_wal_slot_retained_bytes / (pg_wal_slot_cap_bytes > 0) <= 0.75
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "A replication slot retains over half of the WAL cap"
          description: "Retained WAL is between 50 and 75 percent of max_slot_wal_keep_size."
          runbook_url: "docs/runbooks/kafka-replication-slot.md"
      - alert: ReplicationSlotWALRetainedCritical
        expr: pg_wal_slot_retained_bytes / (pg_wal_slot_cap_bytes > 0) > 0.75
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "A replication slot retains over 75 percent of the WAL cap"
          description: "Above the cap PostgreSQL invalidates the slot and CDC continuity is lost; act before that point (docs/WAL_RETENTION.md)."
          runbook_url: "docs/runbooks/kafka-replication-slot.md"
      - alert: ReplicationSlotWALCapUnbounded
        expr: pg_wal_slot_cap_bytes <= 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "max_slot_wal_keep_size is unbounded"
          description: "An unbounded slot retention setting can exhaust the database disk; docs/WAL_RETENTION.md requires a positive cap."
          runbook_url: "docs/runbooks/kafka-replication-slot.md"
      - alert: ReplicationSlotWALStatusDegraded
        expr: pg_wal_slot_status_degraded == 1
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "A replication slot is unreserved or lost"
          description: "wal_status is unreserved or lost: required WAL is being or has been removed and Debezium needs a re-snapshot with a fresh slot."
          runbook_url: "docs/runbooks/kafka-replication-slot.md"
      - alert: RabbitMQDeadLetterQueueNotEmpty
        expr: rabbitmq_detailed_queue_messages{queue=~".+\\.dlq"} > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "A RabbitMQ dead-letter queue holds messages"
          description: "Messages were dead-lettered and not yet replayed; the queue must be empty in steady state, so any depth means a delivery failed permanently."
          runbook_url: "docs/runbooks/rabbitmq-dlq-growth.md"
      - alert: RabbitMQTaskBacklog
        expr: rabbitmq_detailed_queue_messages_ready{queue="notifications.tasks"} > 1000
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "The notification task queue has a backlog"
          description: "More than 1000 ready messages waited ten minutes. Candidate threshold until measured under load."
          runbook_url: "docs/runbooks/rabbitmq-queue-backlog.md"
      - alert: RabbitMQNoConsumers
        expr: rabbitmq_detailed_queue_consumers{queue=~"notifications\\.(tasks|receipts)"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "A RabbitMQ work queue has no consumers"
          description: "No consumer is attached to a queue that must always be consumed; notifications or receipts are not being processed."
          runbook_url: "docs/runbooks/rabbitmq-queue-backlog.md"
      - alert: RabbitMQUnackedHigh
        expr: rabbitmq_detailed_queue_messages_unacked{queue="notifications.tasks"} > 500
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Many delivered notification tasks are unacknowledged"
          description: "Unacknowledged tasks stayed above 500; consumers may be stuck on a provider call or holding prefetch."
          runbook_url: "docs/runbooks/rabbitmq-queue-backlog.md"
      - alert: RabbitMQRetryQueueBacklog
        expr: rabbitmq_detailed_queue_messages{queue="notifications.retry"} > 100
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "The notification retry queue keeps growing"
          description: "More than 100 tasks are waiting for backoff expiry; a provider is failing persistently."
          runbook_url: "docs/runbooks/rabbitmq-queue-backlog.md"
      - alert: RabbitMQPublishConfirmFailures
        expr: increase(jobs_dlq_publish_failed_total[10m]) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Publishing to the RabbitMQ dead-letter queue failed"
          description: "The jobs worker could not confirm a dead-letter publish; the message stays in Postgres for redrive but delivery evidence is at risk."
          runbook_url: "docs/runbooks/rabbitmq-dlq-growth.md"
      - alert: RabbitMQUnconfirmedMessages
        expr: rabbitmq_channel_messages_unconfirmed > 100
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Many RabbitMQ publishes are awaiting confirmation"
          description: "Published but unconfirmed messages exceed 100 across channels; the broker is slow or blocked."
          runbook_url: "docs/runbooks/rabbitmq-queue-backlog.md"
      - alert: RabbitMQMemoryAlarm
        expr: rabbitmq_alarms_memory_used_watermark > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "RabbitMQ memory alarm is active"
          description: "The node hit its memory high watermark and is blocking publishers."
          runbook_url: "docs/runbooks/rabbitmq-queue-backlog.md"
      - alert: RabbitMQDiskAlarm
        expr: rabbitmq_alarms_free_disk_space_watermark > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "RabbitMQ disk alarm is active"
          description: "Free disk fell below the node limit and publishers are blocked."
          runbook_url: "docs/runbooks/rabbitmq-queue-backlog.md"
      - alert: RabbitMQMemoryHigh
        expr: rabbitmq_process_resident_memory_bytes / rabbitmq_resident_memory_limit_bytes > 0.8
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "RabbitMQ memory is above 80 percent of its limit"
          description: "Resident memory approaches the high watermark; investigate queue depth before the alarm blocks publishers."
          runbook_url: "docs/runbooks/rabbitmq-queue-backlog.md"
      - alert: RabbitMQDiskLow
        expr: rabbitmq_disk_space_available_bytes < 2 * rabbitmq_disk_space_available_limit_bytes
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "RabbitMQ free disk is within twice its alarm limit"
          description: "Available disk is below two times the configured free-disk limit."
          runbook_url: "docs/runbooks/rabbitmq-queue-backlog.md"
      - alert: JobsDispatchDeadRecords
        expr: increase(jobs_dispatch_dead_total[15m]) > 0
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "Notification jobs were marked dead"
          description: "Dispatch attempts were exhausted; records need an audited redrive (make redrive-dead) after the cause is fixed."
          runbook_url: "docs/runbooks/rabbitmq-dlq-growth.md"
