{{- if .Values.bootstrap.enabled }}
{{- if not (regexMatch "^([a-zA-Z0-9./_-]+)@sha256:[a-f0-9]{64}$" .Values.bootstrap.image) }}
{{- fail "OpenSearch bootstrap image must be pinned by sha256 digest" }}
{{- end }}
{{- if ne .Values.bootstrap.caSecretName "greenguard-opensearch-ca" }}
{{- fail "OpenSearch bootstrap requires greenguard-opensearch-ca" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: greenguard-opensearch-bootstrap
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: greenguard-opensearch-bootstrap-v1
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app: greenguard-opensearch-bootstrap}
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: greenguard-opensearch-bootstrap
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              trap 'python -c "import urllib.request; urllib.request.urlopen(urllib.request.Request(\"http://127.0.0.1:15020/quitquitquit\", method=\"POST\"), timeout=3).close()" || true' EXIT
              python /app/search_indexer.py bootstrap --version 1
          env:
            - {name: ELASTICSEARCH_URL, value: "https://greenguard-opensearch.greenguard.svc.cluster.local:9200"}
            - {name: OPENSEARCH_USERNAME, value: admin}
            - {name: OPENSEARCH_PASSWORD, valueFrom: {secretKeyRef: {name: greenguard-opensearch-admin, key: password}}}
            - {name: OPENSEARCH_CA_FILE, value: /etc/opensearch-ca/ca.crt}
          volumeMounts:
            - {name: ca, mountPath: /etc/opensearch-ca, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: ca
          secret:
            secretName: greenguard-opensearch-ca
            items: [{key: ca.crt, path: ca.crt}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: greenguard-opensearch-bootstrap}
spec:
  podSelector:
    matchLabels: {app: greenguard-opensearch-bootstrap}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels: {app: greenguard-opensearch}
      ports: [{protocol: TCP, port: 9200}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: istio-system}
      ports: [{protocol: TCP, port: 15012}]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: greenguard-opensearch-bootstrap}
spec:
  selector:
    matchLabels: {app: greenguard-opensearch}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [cluster.local/ns/greenguard/sa/greenguard-opensearch-bootstrap]
      to:
        - operation:
            ports: ["9200"]
{{- end }}
