{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" .Values.image) -}}
{{- fail "image must be an immutable OCI reference ending in @sha256:<64 lowercase hex characters>" -}}
{{- end }}
{{- if and .Values.observability.prometheus.enabled (not .Values.mesh.enabled) -}}
{{- fail "Prometheus Envoy metrics scraping requires mesh.enabled=true" -}}
{{- end }}
{{- if and .Values.observability.prometheus.enabled .Values.observability.prometheus.mergeMetrics (ne (int .Values.observability.prometheus.scrapePort) 15020) -}}
{{- fail "merged Istio metrics require scrapePort=15020" -}}
{{- end }}
{{- if and .Values.observability.prometheus.enabled (not .Values.observability.prometheus.mergeMetrics) (ne (int .Values.observability.prometheus.scrapePort) 15090) -}}
{{- fail "Envoy-only Istio metrics require mergeMetrics=false and scrapePort=15090" -}}
{{- end }}
{{- if and (not .Values.service.enabled) (or .Values.probes.startup.enabled .Values.probes.readiness.enabled .Values.probes.liveness.enabled) -}}
{{- fail "HTTP probes require service.enabled=true so the named http container port is declared" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "greenguard-service.fullname" . }}
  labels:
    {{- include "greenguard-service.labels" . | nindent 4 }}
spec:
  {{- if and (not .Values.autoscaling.hpa.enabled) (not .Values.autoscaling.keda.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "greenguard-service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "greenguard-service.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        sidecar.istio.io/inject: {{ .Values.mesh.enabled | quote }}
        {{- if .Values.mesh.revision }}
        istio.io/rev: {{ .Values.mesh.revision | quote }}
        {{- end }}
      {{- if .Values.observability.prometheus.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: {{ .Values.observability.prometheus.scrapePort | quote }}
        prometheus.istio.io/merge-metrics: {{ .Values.observability.prometheus.mergeMetrics | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "greenguard-service.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.scheduling.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.container.name | quote }}
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          {{- if .Values.service.enabled }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          {{- end }}
          {{- with .Values.container.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.container.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.container.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.container.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            {{- if eq (.Values.probes.startup.type | default "http") "tcp" }}
            tcpSocket:
              port: {{ .Values.service.containerPort }}
            {{- else }}
            httpGet:
              path: {{ .Values.probes.startup.path | quote }}
              port: http
            {{- end }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold | default 30 }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- if eq (.Values.probes.readiness.type | default "http") "tcp" }}
            tcpSocket:
              port: {{ .Values.service.containerPort }}
            {{- else }}
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: http
            {{- end }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            {{- if eq (.Values.probes.liveness.type | default "http") "tcp" }}
            tcpSocket:
              port: {{ .Values.service.containerPort }}
            {{- else }}
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: http
            {{- end }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.container.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
