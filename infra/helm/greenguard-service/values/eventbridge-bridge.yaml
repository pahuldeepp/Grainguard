nameOverride: eventbridge-bridge
replicaCount: 1
terminationGracePeriodSeconds: 60
pdb:
  enabled: false
service:
  enabled: false
  port: 80
  containerPort: 8080
networkPolicy:
  egressPods:
    - { namespace: greenguard, selector: { app: kafka }, port: 29092 }
  ingressSources: []
container:
  name: eventbridge-bridge
  command: ["python", "/app/bridge.py"]
probes:
  startup:
    enabled: true
    type: exec
    path: /healthz
    command: [python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2)']
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    enabled: true
    type: exec
    path: /readyz
    command: [python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/readyz", timeout=2)']
    periodSeconds: 5
  liveness:
    enabled: true
    type: exec
    path: /healthz
    command: [python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2)']
    periodSeconds: 10
    failureThreshold: 6
scheduling:
  nodeSelector:
    greenguard.io/workload-class: compute
  tolerations:
    - key: greenguard.io/workload-class
      operator: Equal
      value: compute
      effect: NoSchedule
