nameOverride: read-entitlement-projector
replicaCount: 1
terminationGracePeriodSeconds: 60
pdb: { enabled: false }
autoscaling:
  hpa: { enabled: false }
service:
  enabled: false
container:
  name: read-entitlement-projector
  command: ["node", "services/read-api/dist/entitlements/projector.js"]
  envFrom:
    - secretRef: { name: read-api-config }
networkPolicy:
  egressPods:
    - { namespace: greenguard, selector: { app: kafka }, port: 29092 }
  egressServices:
    - {
        name: tenant-control-plane,
        namespace: greenguard,
        release: tenant-control-plane,
        port: 3010,
      }
  ingressSources: []
probes:
  startup: { enabled: false }
  readiness: { enabled: false }
  liveness: { enabled: false }
