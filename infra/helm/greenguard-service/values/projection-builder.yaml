nameOverride: projection-builder
service:
  port: 8082
  containerPort: 8082
container:
  name: projection-builder
  env:
    - { name: PROJECTION_HISTORY_HOT_WINDOW, value: 24h }
probes:
  startup: { enabled: true, path: /healthz, periodSeconds: 2, failureThreshold: 30 }
  readiness: { enabled: true, path: /readyz, periodSeconds: 5 }
  liveness: { enabled: true, path: /healthz, periodSeconds: 10 }
networkPolicy:
  egressPods:
    - { namespace: greenguard, selector: { app: kafka }, port: 29092 }
