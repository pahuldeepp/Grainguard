nameOverride: hardware-service-worker
replicaCount: 1
deploymentStrategy: Recreate
terminationGracePeriodSeconds: 60
pdb:
  enabled: false
service:
  enabled: false
  port: 80
  containerPort: 8080
networkPolicy:
  egressPods:
    - { namespace: greenguard, selector: { app: kafka }, port: 29092 }
    - { namespace: greenguard, selector: { app: greenguard-mqtt }, port: 8883 }
  ingressSources: []
container:
  name: hardware-service-worker
  command: ["/usr/local/bin/hardware-worker"]
probes:
  startup: { enabled: false, path: /healthz, periodSeconds: 5, failureThreshold: 30 }
  readiness: { enabled: false, path: /readyz, periodSeconds: 5 }
  liveness: { enabled: false, path: /healthz, periodSeconds: 10 }
scheduling:
  nodeSelector:
    greenguard.io/workload-class: compute
  tolerations:
    - key: greenguard.io/workload-class
      operator: Equal
      value: compute
      effect: NoSchedule
