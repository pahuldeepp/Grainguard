nameOverride: read-api
autoscaling:
  hpa: { enabled: true }
networkPolicy:
  ingressSources:
    - namespace: greenguard
      selector: { app.kubernetes.io/name: gateway, app.kubernetes.io/instance: gateway }
    - namespace: greenguard
      selector: { app.kubernetes.io/name: greenguard-bff, app.kubernetes.io/instance: greenguard }
service:
  port: 4001
  containerPort: 4001
container:
  name: read-api
probes:
  startup: { enabled: true, path: /healthz, periodSeconds: 2, failureThreshold: 30 }
  readiness: { enabled: true, path: /readyz, periodSeconds: 5 }
  liveness: { enabled: true, path: /healthz, periodSeconds: 10 }
