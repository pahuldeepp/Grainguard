nameOverride: device-service
autoscaling:
  hpa: { enabled: true }
networkPolicy:
  ingressSources:
    - namespace: greenguard
      selector: { app.kubernetes.io/name: greenguard-dashboard, app.kubernetes.io/instance: greenguard-dashboard }
service:
  port: 3001
  containerPort: 3001
container:
  name: device-service
probes:
  startup: { enabled: true, path: /healthz, periodSeconds: 2, failureThreshold: 30 }
  readiness: { enabled: true, path: /readyz, periodSeconds: 5 }
  liveness: { enabled: true, path: /healthz, periodSeconds: 10 }
