replicaCount: 1
pdb:
  enabled: false
service:
  enabled: false
  containerPort: 8080
probes:
  startup: {enabled: true, path: /healthz, periodSeconds: 2, failureThreshold: 30}
  readiness: {enabled: true, path: /readyz, periodSeconds: 5}
  liveness: {enabled: true, path: /healthz, periodSeconds: 10}
container:
  name: telemetry-clickhouse-sink
  args: ["clickhouse"]
networkPolicy:
  ingressEnabled: false
  egressPods:
    - namespace: greenguard
      selector: {app: kafka}
      port: 29092
    - namespace: greenguard
      selector: {app.kubernetes.io/name: greenguard-clickhouse, app.kubernetes.io/instance: greenguard-clickhouse}
      port: 8123
