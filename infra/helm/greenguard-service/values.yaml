# Set to a verified OCI digest before deployment.
image: ""
nameOverride: ""
fullnameOverride: ""
replicaCount: 2
terminationGracePeriodSeconds: 30
autoscaling:
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    cpuAverageUtilization: 70
    memoryAverageUtilization: null
  keda:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 10
    pollingInterval: 30
    cooldownPeriod: 300
    triggers: []
pdb:
  enabled: true
  minAvailable: 1
service:
  enabled: true
  port: 80
  containerPort: 8080
container:
  name: app
  env: []
  envFrom: []
  command: []
  args: []
  volumeMounts: []
volumes: []
probes:
  startup:
    enabled: true
    path: /healthz
    periodSeconds: 2
    failureThreshold: 30
  readiness:
    enabled: true
    path: /readyz
    periodSeconds: 5
  liveness:
    enabled: true
    path: /healthz
    periodSeconds: 10
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
scheduling:
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
networkPolicy:
  enabled: true
  ingressEnabled: true
  ingressSources: []
  egressServices: []
  egressCIDRs: []
mesh:
  enabled: false
  revision: ""
  strictMtls: false
  authorization:
    enabled: false
    allowedPrincipals: []
  controlPlaneNamespace: istio-system
  controlPlaneSelector:
    app: istiod
  controlPlanePort: 15012
observability:
  collector:
    enabled: false
    namespace: observability
    selector:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
    otlpPort: 4317
  prometheus:
    enabled: false
    namespace: monitoring
    selector:
      app.kubernetes.io/name: prometheus
    mergeMetrics: true
    scrapePort: 15020
