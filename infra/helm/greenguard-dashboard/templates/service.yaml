apiVersion: v1
kind: Service
metadata:
  name: {{ include "greenguard-dashboard.fullname" . | quote }}
  labels:
    {{- include "greenguard-dashboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "greenguard-dashboard.name" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
