# Set image to the exact OCI digest produced by the verified release workflow.
# A blank default deliberately makes helm template/install fail closed.
image: ""
nameOverride: ""
fullnameOverride: ""
replicaCount: 2
rollouts:
  enabled: false
  analysis:
    prometheusAddress: ""
    successRateQuery: ""
    successRateThreshold: 0.99
    interval: 30s
    count: 3
    failureLimit: 1
pdb:
  enabled: true
  minAvailable: 1
service:
  port: 80
  containerPort: 8080
# When enabled, mount public browser OIDC settings after the deployment URL is
# known. The application fails closed if /config.json is absent in production.
publicOidc:
  enabled: false
  authority: ""
  clientId: ""
  tokenMode: audience
  audience: ""
  resource: ""
  # Browser token/userinfo endpoints can be on a different origin than issuer
  # discovery (for example Cognito's hosted domain).
  connectOrigins: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
# Optional placement controls. Leave unset until the target cluster defines
# matching labels, taints, zones and priority classes.
scheduling:
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
networkPolicy:
  enabled: true
  # This policy belongs to the dashboard chart; it is not a telemetry-ingest
  # public rate limit. See docs/runbooks/telemetry-ingest-exposure.md before
  # exposing telemetry-ingest through a public ingress.
  ingressNamespace: istio-system
  ingressSelector:
    app: istio-ingressgateway
  egressServices:
    - name: gateway
      namespace: ""
      release: gateway
      port: 4002
    - name: device-service
      namespace: ""
      release: device-service
      port: 3001
    - name: telemetry-ingest
      namespace: ""
      release: telemetry-ingest
      port: 8080
mesh:
  enabled: false
  revision: ""
  strictMtls: false
  authorization:
    enabled: false
    allowedPrincipals: []
  controlPlaneNamespace: istio-system
  controlPlaneSelector:
    app: istiod
  controlPlanePort: 15012
observability:
  collector:
    enabled: false
    namespace: observability
    selector:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
    otlpPort: 4317
  prometheus:
    enabled: false
    namespace: monitoring
    selector:
      app: prometheus
    # Istio merged mode is 15020; Envoy-only mode is 15090.
    mergeMetrics: true
    scrapePort: 15020
