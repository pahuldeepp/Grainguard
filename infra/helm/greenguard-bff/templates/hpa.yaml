{{- if .Values.autoscaling.enabled }}
{{- if or (ge (int .Values.autoscaling.minReplicas) (int .Values.autoscaling.maxReplicas)) (lt (int .Values.autoscaling.cpuAverageUtilization) 1) (gt (int .Values.autoscaling.cpuAverageUtilization) 100) }}
{{- fail "BFF HPA requires minReplicas < maxReplicas and CPU utilization from 1 to 100" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "greenguard-bff.fullname" . }}
  labels:
    {{- include "greenguard-bff.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "greenguard-bff.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.cpuAverageUtilization }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
