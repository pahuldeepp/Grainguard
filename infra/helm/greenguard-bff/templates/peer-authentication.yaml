{{- if .Values.mesh.strictMtls }}
{{- if not .Values.mesh.enabled }}
{{- fail "mesh.strictMtls requires mesh.enabled=true" }}
{{- end }}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ include "greenguard-bff.fullname" . }}
  labels:
    {{- include "greenguard-bff.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "greenguard-bff.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  mtls:
    mode: STRICT
{{- end }}
