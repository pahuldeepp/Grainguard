# Set image to the exact OCI digest produced by the verified release workflow.
# A blank default deliberately makes helm template/install fail closed.
image: ""
nameOverride: ""
fullnameOverride: ""
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuAverageUtilization: 70
pdb:
  enabled: true
  minAvailable: 1
service:
  port: 80
  containerPort: 4000
env: []
envFrom: []
volumeMounts: []
volumes: []
kafka:
  caSecretName: ""
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
# Optional placement controls. Leave unset until the target cluster defines
# matching labels, taints, zones and priority classes.
scheduling:
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
networkPolicy:
  enabled: true
  ingressNamespace: istio-system
  ingressSelector:
    app: istio-ingressgateway
  additionalIngressSources:
    - namespace: greenguard
      selector:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/instance: gateway
  egressServices:
    - name: read-api
      namespace: greenguard
      release: read-api
      port: 4001
    - name: workflow-alerts
      namespace: greenguard
      release: workflow-alerts
      port: 3004
    - name: saga-orchestrator
      namespace: greenguard
      release: saga-api
      port: 8092
    - name: tenant-control-plane
      namespace: greenguard
      release: tenant-control-plane
      port: 3010
    - name: ml-scoring
      namespace: greenguard
      release: ml-scoring
      port: 8080
  egressPods:
    - { namespace: greenguard, selector: { app: redis-cluster }, port: 6379 }
    - { namespace: greenguard, selector: { app: kafka }, port: 29092 }
mesh:
  enabled: false
  revision: ""
  strictMtls: false
  authorization:
    enabled: false
    allowedPrincipals: []
  controlPlaneNamespace: istio-system
  controlPlaneSelector:
    app: istiod
  controlPlanePort: 15012
observability:
  collector:
    enabled: false
    namespace: observability
    selector:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
    otlpPort: 4317
  prometheus:
    enabled: false
    namespace: monitoring
    selector:
      app: prometheus
    # Istio merged mode is 15020; Envoy-only mode is 15090.
    mergeMetrics: true
    scrapePort: 15020
