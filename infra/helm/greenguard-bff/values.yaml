# Set image to the exact OCI digest produced by the verified release workflow.
# A blank default deliberately makes helm template/install fail closed.
image: ""
nameOverride: ""
fullnameOverride: ""
replicaCount: 2
# Application total deadline; pod adds 10s for termination delivery overhead.
terminationGraceMilliseconds: 340000
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuAverageUtilization: 70
pdb:
  enabled: true
  minAvailable: 1
service:
  port: 80
  containerPort: 4000
env: []
envFrom: []
volumeMounts: []
volumes: []
kafka:
  caSecretName: ""
modelGatewayTokens:
  enabled: false
  secretName: greenguard-bff-model-gateway
  secretKey: gateway-tokens.json
  filePath: /private-model-gateway/gateway-tokens.json
delegationKey:
  secretName: greenguard-bff-delegation
  privateKeySecretKey: private-key.pem
  keyIdSecretKey: kid
  filePath: /private-model-gateway/private-key.pem
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
# Optional placement controls. Leave unset until the target cluster defines
# matching labels, taints, zones and priority classes.
scheduling:
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
networkPolicy:
  enabled: true
  ingressNamespace: istio-system
  ingressSelector:
    app: istio-ingressgateway
  additionalIngressSources:
    - namespace: greenguard
      selector:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/instance: gateway
  egressServices:
    - name: billing-service
      namespace: greenguard
      release: billing-service
      port: 3021
    - name: jobs-worker
      namespace: greenguard
      release: jobs-worker
      port: 8095
    - name: notification-service
      namespace: greenguard
      release: notification-service
      port: 8096
    # Must match the separately provisioned knowledge API pods and target port.
    - name: knowledge-service
      namespace: greenguard-knowledge
      release: knowledge-api
      port: 8080
    - name: read-api
      namespace: greenguard
      release: read-api
      port: 4001
    - name: workflow-alerts
      namespace: greenguard
      release: workflow-alerts
      port: 3004
    - name: saga-orchestrator
      namespace: greenguard
      release: saga-api
      port: 8092
    - name: tenant-control-plane
      namespace: greenguard
      release: tenant-control-plane
      port: 3010
    - name: ml-scoring-synthetic
      namespace: ml-synthetic
      release: ml-scoring-synthetic
      port: 8080
  egressPods:
    - { namespace: greenguard, selector: { app: redis-cluster }, port: 6379 }
    - { namespace: greenguard, selector: { app: kafka }, port: 29092 }
    # AI runtime pods use stable app-name labels rather than Helm release
    # labels; allow only the BFF's direct, tenant-delegated tool/API hops.
    - { namespace: greenguard, selector: { app.kubernetes.io/name: knowledge-service }, port: 8080 }
    - { namespace: greenguard, selector: { app.kubernetes.io/name: grain-advisor }, port: 8088 }
    - { namespace: greenguard, selector: { app.kubernetes.io/name: model-gateway }, port: 8080 }
    - { namespace: greenguard, selector: { app.kubernetes.io/name: mcp-gateway }, port: 8090 }
mesh:
  enabled: false
  revision: ""
  strictMtls: false
  authorization:
    enabled: false
    allowedPrincipals: []
  controlPlaneNamespace: istio-system
  controlPlaneSelector:
    app: istiod
  controlPlanePort: 15012
observability:
  collector:
    enabled: false
    namespace: observability
    selector:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
    otlpPort: 4317
  prometheus:
    enabled: false
    namespace: monitoring
    selector:
      app: prometheus
    # Istio merged mode is 15020; Envoy-only mode is 15090.
    mergeMetrics: true
    scrapePort: 15020
