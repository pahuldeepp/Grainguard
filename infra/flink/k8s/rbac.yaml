apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
automountServiceAccountToken: true
---
# Minimum for Flink's native Kubernetes HA and TaskManager management inside this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: [create, get, list, watch, update, patch, delete]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [create, get, list, watch, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: flink }
subjects:
  - { kind: ServiceAccount, name: flink }
