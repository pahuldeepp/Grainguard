{{- if not (regexMatch "^[a-z0-9][a-z0-9-]{2,99}$" .Values.cell) }}{{ fail "disposable cell is required" }}{{ end }}
{{- if not (regexMatch "^[0-9]{12}$" .Values.accountId) }}{{ fail "AWS account ID is required" }}{{ end }}
{{- if not (regexMatch "^[a-z]{2}-[a-z]+-[0-9]+$" .Values.region) }}{{ fail "AWS region is required" }}{{ end }}
{{- $arnPattern := printf "^arn:aws:elasticloadbalancing:%s:%s:targetgroup/[A-Za-z0-9-]+/[a-f0-9]{16}$" .Values.region .Values.accountId }}
{{- if not (regexMatch $arnPattern .Values.targetGroupARN) }}{{ fail "target group must belong to the selected account and region" }}{{ end }}
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: greenguard-mesh-ingress
  namespace: istio-system
  labels:
    greenguard.io/cell: {{ .Values.cell | quote }}
spec:
  targetGroupARN: {{ .Values.targetGroupARN | quote }}
  targetType: ip
  serviceRef:
    name: istio-ingressgateway
    port: 80
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: greenguard-edge
  namespace: istio-system
  labels:
    greenguard.io/cell: {{ .Values.cell | quote }}
spec:
  selector:
    app: istio-ingressgateway
  servers:
    - port: {number: 80, name: http, protocol: HTTP}
      hosts: ["greenguard/*"]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: greenguard-edge
  namespace: greenguard
  labels:
    greenguard.io/cell: {{ .Values.cell | quote }}
spec:
  hosts: ["*"]
  gateways: [istio-system/greenguard-edge]
  http:
    # Only this exact path reaches billing directly; the owner verifies Stripe's signature.
    - name: stripe-webhook
      match:
        - uri: {exact: /webhooks/stripe}
          headers:
            x-greenguard-origin: {exact: bff}
      route:
        - destination:
            host: billing-service.greenguard.svc.cluster.local
            port: {number: 3021}
    # The API CloudFront distribution also hosts the managed Dex issuer. Keep
    # the exact prefix route ahead of the general BFF route, with caching off
    # at the distribution and the origin header still required.
{{- if .Values.dexEnabled }}
    - name: managed-dex
      match:
        - uri: {prefix: /dex}
          headers:
            x-greenguard-origin: {exact: bff}
      route:
        - destination:
            host: greenguard-dex.greenguard.svc.cluster.local
            port: {number: 5556}
{{- end }}
    - name: bff
      match:
        - headers:
            x-greenguard-origin: {exact: bff}
      route:
        - destination:
            host: bff-greenguard-bff.greenguard.svc.cluster.local
            port: {number: 80}
    - name: dashboard
      match:
        - headers:
            x-greenguard-origin: {exact: dashboard}
      route:
        - destination:
            host: dashboard-greenguard-dashboard.greenguard.svc.cluster.local
            port: {number: 80}
    - name: unknown-origin
      directResponse: {status: 404}
{{- range $name, $host := dict "billing" "billing-service" "bff" "bff-greenguard-bff" "dashboard" "dashboard-greenguard-dashboard" "dex" "greenguard-dex" }}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: greenguard-edge-{{ $name }}-mtls
  namespace: greenguard
  labels:
    greenguard.io/cell: {{ $.Values.cell | quote }}
spec:
  host: {{ $host }}.greenguard.svc.cluster.local
  trafficPolicy:
    tls: {mode: ISTIO_MUTUAL}
{{- end }}
