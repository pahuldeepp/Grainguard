{{- if or .Values.clickhouseEnabled .Values.membershipEnabled }}
{{- if ne .Release.Namespace .Values.namespace }}{{ fail "acceptance probes must render in the configured GreenGuard namespace" }}{{ end }}
{{- if ne .Values.namespace "greenguard" }}{{ fail "disposable acceptance probes are restricted to greenguard namespace" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]{2,62}$" (.Values.cell | default "")) }}{{ fail "acceptance probes require a valid disposable cell name" }}{{ end }}
{{- if not (regexMatch "^[a-f0-9]{40}$" (.Values.revision | default "")) }}{{ fail "acceptance probes require the exact 40-character GitOps revision" }}{{ end }}
{{- if .Values.clickhouseEnabled }}
{{- if not (regexMatch "^[a-z0-9.-]+(?::[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$" (.Values.clickhouseImage | default "")) }}{{ fail "ClickHouse probe image must be an immutable OCI digest" }}{{ end }}
{{- if ne .Values.clickhouseSecret "greenguard-telemetry-clickhouse-config" }}{{ fail "ClickHouse probe requires the dedicated telemetry ClickHouse Secret" }}{{ end }}
{{- end }}
{{- if .Values.membershipEnabled }}
{{- if not (regexMatch "^[a-z0-9.-]+(?::[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$" (.Values.tenantControlPlaneImage | default "")) }}{{ fail "membership probe image must be an immutable tenant-control-plane digest" }}{{ end }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{1,99}$" (.Values.membershipAudience | default "")) }}{{ fail "membership probe requires the configured OIDC audience" }}{{ end }}
{{- if ne .Values.controlPlaneSecret "tenant-control-plane-config" }}{{ fail "membership probe requires the tenant-control-plane Secret" }}{{ end }}
{{- if ne .Values.identitySecret "greenguard-dex-config" }}{{ fail "membership probe requires the managed Dex identity Secret" }}{{ end }}
{{- if ne .Values.accessTokenSecret "greenguard-acceptance-oidc-token" }}{{ fail "membership probe requires the operator-provisioned access-token Secret" }}{{ end }}
{{- end }}
{{- $run := sha256sum (toJson .Values) | trunc 12 -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: greenguard-live-acceptance-probes
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: greenguard-acceptance-{{ $run }}
  namespace: {{ .Release.Namespace }}
data:
  tenant-membership-readback.mjs: |
{{ .Files.Get "files/tenant-membership-readback.mjs" | indent 4 }}
  clickhouse-roundtrip.sql: |
{{ .Files.Get "files/clickhouse-roundtrip.sql" | indent 4 }}
{{- if .Values.clickhouseEnabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gg-acceptance-clickhouse-{{ $run }}
  namespace: {{ .Release.Namespace }}
  labels:
    greenguard.io/cell: {{ .Values.cell | quote }}
    greenguard.io/migration-gate: "false"
    greenguard.io/acceptance-probe: clickhouse-roundtrip
    greenguard.io/acceptance-revision: {{ .Values.revision | quote }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greenguard-live-acceptance-probes
        app.kubernetes.io/instance: greenguard-live-acceptance-probes
        greenguard.io/cell: {{ .Values.cell | quote }}
        greenguard.io/acceptance-probe: clickhouse-roundtrip
      annotations:
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/nativeSidecar: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
    spec:
      serviceAccountName: greenguard-live-acceptance-probes
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: clickhouse-roundtrip
          image: {{ .Values.clickhouseImage | quote }}
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -ec]
          args:
            - >-
              clickhouse-client --host greenguard-clickhouse.greenguard.svc.cluster.local
              --port 8123 --protocol http --user "$CLICKHOUSE_USER"
              --password "$CLICKHOUSE_PASSWORD" --session_id "gg-acceptance-${HOSTNAME}"
              --multiquery --format=Null
              --queries-file /probe/clickhouse-roundtrip.sql
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.clickhouseSecret | quote }}, key: CLICKHOUSE_USER}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.clickhouseSecret | quote }}, key: CLICKHOUSE_PASSWORD}
          volumeMounts:
            - {name: probe, mountPath: /probe, readOnly: true}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: probe
          configMap: {name: greenguard-acceptance-{{ $run }}, defaultMode: 0444}
{{- end }}
{{- if .Values.membershipEnabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gg-acceptance-membership-{{ $run }}
  namespace: {{ .Release.Namespace }}
  labels:
    greenguard.io/cell: {{ .Values.cell | quote }}
    greenguard.io/migration-gate: "false"
    greenguard.io/acceptance-probe: tenant-membership-readback
    greenguard.io/acceptance-revision: {{ .Values.revision | quote }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greenguard-live-acceptance-probes
        app.kubernetes.io/instance: greenguard-live-acceptance-probes
        greenguard.io/cell: {{ .Values.cell | quote }}
        greenguard.io/acceptance-probe: tenant-membership-readback
      annotations:
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/nativeSidecar: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
    spec:
      serviceAccountName: greenguard-live-acceptance-probes
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: tenant-membership-readback
          image: {{ .Values.tenantControlPlaneImage | quote }}
          imagePullPolicy: IfNotPresent
          command: [node, /probe/tenant-membership-readback.mjs]
          env:
            - name: CONTROL_LOOKUP_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.controlPlaneSecret | quote }}, key: CONTROL_LOOKUP_TOKEN}
            - name: DEX_ISSUER
              valueFrom:
                secretKeyRef: {name: {{ .Values.identitySecret | quote }}, key: DEX_ISSUER}
            - {name: MEMBERSHIP_AUDIENCE, value: {{ .Values.membershipAudience | quote }}}
            - name: GREENGUARD_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.accessTokenSecret | quote }}, key: access-token}
          volumeMounts:
            - {name: probe, mountPath: /probe, readOnly: true}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: probe
          configMap: {name: greenguard-acceptance-{{ $run }}, defaultMode: 0444}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: greenguard-live-acceptance-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: greenguard-live-acceptance-probes
      app.kubernetes.io/instance: greenguard-live-acceptance-probes
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- if .Values.clickhouseEnabled }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: greenguard}
          podSelector:
            matchLabels: {app.kubernetes.io/name: greenguard-clickhouse}
      ports:
        - {protocol: TCP, port: 8123}
{{- end }}
{{- if .Values.membershipEnabled }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: greenguard}
          podSelector:
            matchLabels: {app.kubernetes.io/instance: tenant-control-plane}
      ports:
        - {protocol: TCP, port: 3010}
{{- end }}
{{- if .Values.clickhouseEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: greenguard-clickhouse-acceptance-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: greenguard-clickhouse}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: greenguard}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: greenguard-live-acceptance-probes
              greenguard.io/acceptance-probe: clickhouse-roundtrip
      ports:
        - {protocol: TCP, port: 8123}
{{- end }}
{{- if .Values.membershipEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-control-plane-acceptance-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: tenant-control-plane}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: greenguard}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: greenguard-live-acceptance-probes
              greenguard.io/acceptance-probe: tenant-membership-readback
      ports:
        - {protocol: TCP, port: 3010}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: tenant-control-plane-acceptance-readback
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/instance: tenant-control-plane}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/{{ .Release.Namespace }}/sa/greenguard-live-acceptance-probes"]
      to:
        - operation:
            methods: [GET]
            paths: ["/v1/internal/memberships"]
{{- end }}
{{- end }}
