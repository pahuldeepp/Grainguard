{{- if not (regexMatch "^[a-z0-9.-]+(?::[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$" (.Values.image | default "")) }}{{ fail "ClickHouse image must be an immutable OCI digest" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (.Values.storageClassName | default "")) }}{{ fail "ClickHouse storage class is required" }}{{ end }}
{{- if not (regexMatch "^[1-9][0-9]*Gi$" (.Values.storageSize | default "")) }}{{ fail "ClickHouse storage size must use an integer Gi quantity" }}{{ end }}
{{- if ne (.Values.authSecret | default "") "greenguard-telemetry-clickhouse-config" }}{{ fail "ClickHouse requires its scoped credentials Secret" }}{{ end }}
{{- if not (kindIs "slice" .Values.replayS3CIDRs) }}{{ fail "replayS3CIDRs must be a list" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: greenguard-clickhouse-init
data:
  001-telemetry.sql: |
{{ .Files.Get "files/telemetry.sql" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-replay
  namespace: greenguard
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: greenguard-clickhouse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: greenguard-clickhouse
  ports:
    - {name: http, port: 8123, targetPort: http, protocol: TCP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: greenguard-clickhouse
spec:
  serviceName: greenguard-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: greenguard-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greenguard-clickhouse
        app.kubernetes.io/instance: greenguard-clickhouse
        greenguard.io/lifecycle: disposable
        sidecar.istio.io/inject: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: clickhouse
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.authSecret | quote }}, key: CLICKHOUSE_USER}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.authSecret | quote }}, key: CLICKHOUSE_PASSWORD}
            - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
          ports:
            - {name: http, containerPort: 8123, protocol: TCP}
          startupProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
            - {name: init-sql, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: logs, mountPath: /var/log/clickhouse-server}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: init-sql, configMap: {name: greenguard-clickhouse-init}}
        - {name: logs, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.storageSize | quote }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: greenguard-clickhouse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: greenguard-clickhouse
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: greenguard}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: greenguard-service
              app.kubernetes.io/instance: telemetry-clickhouse-sink
      ports:
        - {protocol: TCP, port: 8123}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-replay-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: greenguard-telemetry-replay
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: greenguard}
          podSelector:
            matchLabels: {app: kafka}
      ports:
        - {protocol: TCP, port: 29092}
{{- range .Values.replayS3CIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {protocol: TCP, port: 443}
{{- end }}
