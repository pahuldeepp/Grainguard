{{- with .Values.ownerMigrations }}
{{- $_ := include "ownerMigration.targets" (merge (dict "revision" $.Values.revision) .) -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: greenguard-owner-migrations
  namespace: argocd
  labels:
    greenguard.io/cell: {{ $.Values.cell | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "24"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ $.Values.repositoryUrl | quote }}
    targetRevision: {{ $.Values.revision | quote }}
    path: infra/gitops/disposable/owner-migrations-chart
    helm:
      valuesObject:
{{ toYaml (merge (dict "revision" $.Values.revision) .) | indent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: greenguard
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
{{- end }}
