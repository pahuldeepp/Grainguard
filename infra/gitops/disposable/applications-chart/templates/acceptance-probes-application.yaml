{{- $probes := .Values.acceptanceProbes | default dict }}
{{- if $probes.enabled }}
{{- if not (regexMatch "^[a-f0-9]{40}$" .Values.revision) }}{{ fail "live acceptance requires an exact Git revision" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9.-]+(?::[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$" ($probes.clickhouseImage | default "")) }}{{ fail "live acceptance requires the pinned ClickHouse client image" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9.-]+(?::[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$" ($probes.tenantControlPlaneImage | default "")) }}{{ fail "live acceptance requires the pinned tenant-control-plane image" }}{{ end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: greenguard-live-acceptance-probes
  namespace: argocd
  labels: {greenguard.io/cell: {{ .Values.cell | quote }}}
  annotations: {argocd.argoproj.io/sync-wave: "29"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repositoryUrl | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: infra/gitops/disposable/acceptance-probes-chart
    helm:
      releaseName: greenguard-live-acceptance-probes
      valuesObject:
        clickhouseEnabled: true
        membershipEnabled: {{ $probes.membershipEnabled | default false }}
        namespace: greenguard
        cell: {{ .Values.cell | quote }}
        revision: {{ .Values.revision | quote }}
        clickhouseImage: {{ $probes.clickhouseImage | quote }}
        tenantControlPlaneImage: {{ $probes.tenantControlPlaneImage | quote }}
        membershipAudience: {{ $probes.membershipAudience | quote }}
        accessTokenSecret: greenguard-acceptance-oidc-token
        clickhouseSecret: greenguard-telemetry-clickhouse-config
        controlPlaneSecret: tenant-control-plane-config
        identitySecret: greenguard-dex-config
  destination:
    server: https://kubernetes.default.svc
    namespace: greenguard
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
{{- end }}
