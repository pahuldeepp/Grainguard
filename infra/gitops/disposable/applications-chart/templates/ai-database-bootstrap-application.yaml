{{- $ai := .Values.aiRuntime | default dict }}
{{- if $ai.enabled }}
{{- if not (regexMatch "^[a-f0-9]{40}$" .Values.revision) }}{{ fail "AI database bootstrap requires exact Git revision" }}{{ end }}
{{- if not $ai.secretSyncEpoch }}{{ fail "AI role/bootstrap/migration Secrets must synchronize before database bootstrap" }}{{ end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: greenguard-ai-database-bootstrap
  namespace: argocd
  labels: {greenguard.io/cell: {{ .Values.cell | quote }}}
  annotations: {argocd.argoproj.io/sync-wave: "22"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repositoryUrl | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: infra/gitops/disposable/ai-database-bootstrap-chart
    helm:
      valuesObject:
        enabled: true
        cell: {{ .Values.cell | quote }}
        revision: {{ .Values.revision | quote }}
        secretSyncEpoch: {{ $ai.secretSyncEpoch | quote }}
        rdsHost: {{ $ai.rdsHost | quote }}
        rdsCIDRs: {{ toJson $ai.rdsCIDRs }}
        adminSecret: greenguard-rds-bootstrap
        roleSecret: greenguard-ai-database-roles
        caSecret: greenguard-rds-ca
  destination: {server: https://kubernetes.default.svc, namespace: greenguard}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
{{- end }}
