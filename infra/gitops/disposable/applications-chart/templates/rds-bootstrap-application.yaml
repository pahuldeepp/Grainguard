{{- if not (regexMatch "^[a-f0-9]{40}$" .Values.revision) }}{{ fail "revision must be an exact Git commit SHA" }}{{ end }}
{{- if not (regexMatch "^(https://[^ ]+\\.git|ssh://git@github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\\.git)$" .Values.repositoryUrl) }}{{ fail "repositoryUrl must be an HTTPS Git URL or a GitHub SSH deploy-key URL" }}{{ end }}
{{- if not .Values.cell }}{{ fail "cell is required" }}{{ end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: greenguard-rds-bootstrap
  namespace: argocd
  labels:
    greenguard.io/cell: {{ .Values.cell | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repositoryUrl | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: infra/gitops/disposable/rds-bootstrap-chart
  {{- if or .Values.dataPlane.enabled .Values.managedDex.enabled }}
    helm:
      valuesObject:
{{- if .Values.dataPlane.enabled }}
        rdsHost: {{ .Values.dataPlane.rdsHost | quote }}
{{- end }}
{{- if .Values.managedDex.enabled }}
        managedDex: {{ .Values.managedDex.enabled }}
{{- end }}
{{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: greenguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
