{{- if not (regexMatch "^[a-f0-9]{40}$" .Values.revision) }}{{ fail "revision must be an exact Git commit SHA" }}{{ end }}
{{- if not (regexMatch "^(https://[^ ]+\\.git|ssh://git@github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\\.git)$" .Values.repositoryUrl) }}{{ fail "repositoryUrl must be an HTTPS Git URL or a GitHub SSH deploy-key URL" }}{{ end }}
{{- if not .Values.cell }}{{ fail "cell is required" }}{{ end }}
{{- range .Values.releases }}
{{- if not (regexMatch "^[a-z0-9-]+$" .name) }}{{ fail "invalid release name" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9-]+$" .chart) }}{{ fail "invalid chart name" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9.-]+(?::[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$" .imageDigest) }}{{ fail (printf "%s: immutable image digest required" .name) }}{{ end }}
{{- if .shardRoutingRequired }}
{{- $container := get (.extraValues | default dict) "container" | default dict }}
{{- $env := get $container "env" | default list }}
{{- $routingMode := false }}
{{- range $entry := $env }}
{{- if and (eq (get $entry "name") "SHARD_ROUTING_REQUIRED") (eq (get $entry "value") "true") }}{{ $routingMode = true }}{{ end }}
{{- end }}
{{- if not $routingMode }}{{ fail (printf "%s: SHARD_ROUTING_REQUIRED=true is required for sharded releases" .name) }}{{ end }}
{{- end }}
{{- if hasKey (.extraValues | default dict) "image" }}{{ fail (printf "%s: extraValues.image cannot override the pinned digest" .name) }}{{ end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: greenguard-{{ .name }}
  namespace: argocd
  labels:
    greenguard.io/cell: {{ $.Values.cell | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $.Values.repositoryUrl | quote }}
    targetRevision: {{ $.Values.revision | quote }}
    path: infra/helm/{{ .chart }}
    helm:
      releaseName: {{ .name | quote }}
{{- if .profile }}
      valueFiles:
        - values/{{ .profile }}.yaml
{{- end }}
      valuesObject:
        image: {{ .imageDigest | quote }}
{{- with .extraValues }}
{{ toYaml . | indent 8 }}
{{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: greenguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
