{{- if not (regexMatch "^postgres:16-alpine@sha256:[a-f0-9]{64}$" .Values.image) }}{{ fail "bootstrap image must be postgres:16-alpine with a digest" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.credentialSecret) }}{{ fail "credentialSecret must be a Kubernetes Secret name" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.caSecret) }}{{ fail "caSecret must be a Kubernetes Secret name" }}{{ end }}
{{- if not (and (le (len .Values.name) 46) (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.name)) }}{{ fail "name must be a Kubernetes name" }}{{ end }}
{{- if not (kindIs "bool" .Values.operationalOnly) }}{{ fail "operationalOnly must be boolean" }}{{ end }}
{{- if and .Values.operationalOnly (not .Values.rdsHost) }}{{ fail "operationalOnly requires an explicit RDS endpoint" }}{{ end }}
{{- if and .Values.rdsHost (not (regexMatch "^[a-zA-Z0-9.-]+\\.rds\\.amazonaws\\.com$" .Values.rdsHost)) }}{{ fail "rdsHost must be a validated RDS endpoint" }}{{ end }}
{{- $sql := .Files.Get "files/init-databases.sql" }}
{{- if not $sql }}{{ fail "RDS bootstrap SQL is missing" }}{{ end }}
{{- $revision := sha256sum (printf "%s\n%s\n%t\n%s\n%s\n%s" .Values.image $sql .Values.operationalOnly .Values.credentialSecret .Values.caSecret .Values.rdsHost) | trunc 16 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-{{ $revision }}
data:
  init-databases.sql: |
{{ $sql | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}-{{ $revision }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["psql"]
          args: ["-X", "-v", "ON_ERROR_STOP=1", "-v", "GG_RDS=1", {{ if .Values.operationalOnly }}"-v", "GG_OPERATIONAL_ONLY=1", {{ end }}"-f", "/bootstrap/init-databases.sql"]
          envFrom:
            - secretRef:
                name: {{ .Values.credentialSecret | quote }}
          env:
{{- if .Values.rdsHost }}
            - name: PGHOST
              value: {{ .Values.rdsHost | quote }}
{{- end }}
            - name: PGUSER
              value: greenguard_admin
            - name: PGDATABASE
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /rds-ca/ca.pem
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sql
              mountPath: /bootstrap
              readOnly: true
            - name: ca
              mountPath: /rds-ca
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: {{ .Values.name }}-{{ $revision }}
        - name: ca
          secret:
            secretName: {{ .Values.caSecret | quote }}
