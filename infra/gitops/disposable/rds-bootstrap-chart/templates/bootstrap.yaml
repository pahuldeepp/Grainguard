{{- if not (regexMatch "^postgres:16-alpine@sha256:[a-f0-9]{64}$" .Values.image) }}{{ fail "bootstrap image must be postgres:16-alpine with a digest" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.credentialSecret) }}{{ fail "credentialSecret must be a Kubernetes Secret name" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.caSecret) }}{{ fail "caSecret must be a Kubernetes Secret name" }}{{ end }}
{{- $sql := .Files.Get "files/init-databases.sql" }}
{{- if not $sql }}{{ fail "RDS bootstrap SQL is missing" }}{{ end }}
{{- $revision := sha256sum (printf "%s\n%s" .Values.image $sql) | trunc 16 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: greenguard-rds-bootstrap-{{ $revision }}
data:
  init-databases.sql: |
{{ $sql | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: greenguard-rds-bootstrap-{{ $revision }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["psql"]
          args: ["-X", "-v", "ON_ERROR_STOP=1", "-v", "GG_RDS=1", "-f", "/bootstrap/init-databases.sql"]
          envFrom:
            - secretRef:
                name: {{ .Values.credentialSecret | quote }}
          env:
            - name: PGUSER
              value: greenguard_admin
            - name: PGDATABASE
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /rds-ca/ca.pem
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sql
              mountPath: /bootstrap
              readOnly: true
            - name: ca
              mountPath: /rds-ca
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: greenguard-rds-bootstrap-{{ $revision }}
        - name: ca
          secret:
            secretName: {{ .Values.caSecret | quote }}
