{{- if not (regexMatch "^[^[:space:]@]+@sha256:[a-f0-9]{64}$" .Values.cassandraImage) }}{{ fail "Cassandra image must be immutable OCI digest" }}{{ end }}
{{- if not (regexMatch "^[^[:space:]@]+@sha256:[a-f0-9]{64}$" .Values.migratorImage) }}{{ fail "Cassandra migrator image must be immutable OCI digest" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.authSecret) }}{{ fail "Cassandra auth Secret name is missing or invalid" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.tlsSecret) }}{{ fail "Cassandra TLS Secret name is missing or invalid" }}{{ end }}
{{- if not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" .Values.apiServerCIDR) }}{{ fail "Cassandra activator requires an exact IPv4 Kubernetes API service /32" }}{{ end }}
{{- range (splitList "." (trimSuffix "/32" .Values.apiServerCIDR)) }}{{- if gt (atoi .) 255 }}{{ fail "Cassandra API service CIDR has an invalid IPv4 octet" }}{{ end }}{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.storageClassName) }}{{ fail "Cassandra storage class is invalid" }}{{ end }}
{{- if not (regexMatch "^[1-9][0-9]*Gi$" .Values.storageSize) }}{{ fail "Cassandra PVC size must be positive Gi" }}{{ end }}
apiVersion: v1
kind: Service
metadata:
  name: greenguard-cassandra
spec:
  clusterIP: None
  selector:
    app: greenguard-cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: greenguard-cassandra
spec:
  serviceName: greenguard-cassandra
  replicas: 1
  selector:
    matchLabels:
      app: greenguard-cassandra
  template:
    metadata:
      labels:
        app: greenguard-cassandra
        greenguard.io/cassandra-auth-ready: "false"
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure-cql
          image: {{ .Values.cassandraImage | quote }}
          command: ["python3", "/bootstrap/configure.py"]
          env:
            - name: CASSANDRA_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tlsSecret | quote }}
                  key: keystore-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: generated-config, mountPath: /generated-config }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
            - { name: cql-tls, mountPath: /cql-tls, readOnly: true }
      containers:
        - name: cassandra
          image: {{ .Values.cassandraImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: CASSANDRA_CLUSTER_NAME, value: greenguard-disposable }
            - { name: CASSANDRA_DC, value: datacenter1 }
            - { name: CASSANDRA_ENDPOINT_SNITCH, value: GossipingPropertyFileSnitch }
            - { name: CASSANDRA_NUM_TOKENS, value: "16" }
            - { name: MAX_HEAP_SIZE, value: 512M }
            - { name: HEAP_NEWSIZE, value: 128M }
          ports:
            - { name: cql, containerPort: 9042 }
          startupProbe:
            exec:
              command: ["python3", "/bootstrap/check-tls.py"]
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["python3", "/bootstrap/check-tls.py"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "2", memory: 3Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/cassandra }
            - { name: generated-config, mountPath: /etc/cassandra }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
            - { name: cql-tls, mountPath: /cql-tls, readOnly: true }
      volumes:
        - name: generated-config
          emptyDir: { sizeLimit: 10Mi }
        - name: bootstrap
          configMap:
            name: greenguard-cassandra-bootstrap
        - name: cql-tls
          secret:
            secretName: {{ .Values.tlsSecret | quote }}
            items:
              - { key: server.p12, path: server.p12 }
              - { key: ca.crt, path: ca.crt }
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          greenguard.io/disposable: "true"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.storageSize | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: greenguard-cassandra-role-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: { app: greenguard-cassandra-bootstrap, greenguard.io/cassandra-job: "true" }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: {{ .Values.cassandraImage | quote }}
          command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: auth, mountPath: /auth, readOnly: true }
            - { name: tls, mountPath: /cql-tls, readOnly: true }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
      volumes:
        - name: auth
          secret:
            secretName: {{ .Values.authSecret | quote }}
            items:
              - { key: admin-password, path: admin-password }
              - { key: reader-password, path: reader-password }
              - { key: writer-password, path: writer-password }
        - name: tls
          secret:
            secretName: {{ .Values.tlsSecret | quote }}
            items:
              - { key: ca.crt, path: ca.crt }
        - name: bootstrap
          configMap: { name: greenguard-cassandra-bootstrap }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: greenguard-cassandra-schema-{{ sha256sum .Values.migratorImage | trunc 12 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: greenguard-cassandra-schema
        greenguard.io/cassandra-job: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema
          image: {{ .Values.migratorImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/cassandra-migrate"]
          env:
            - { name: CASSANDRA_HOSTS, value: greenguard-cassandra }
            - { name: CASSANDRA_KEYSPACE, value: greenguard_history }
            - { name: CASSANDRA_DATACENTER, value: datacenter1 }
            - { name: CASSANDRA_REPLICATION_FACTOR, value: "1" }
            - { name: CASSANDRA_REQUIRE_SECURE, value: "1" }
            - { name: CASSANDRA_USERNAME, value: cassandra }
            - { name: CASSANDRA_TLS_CA_FILE, value: /cql-tls/ca.crt }
            - { name: CASSANDRA_TLS_SERVER_NAME, value: greenguard-cassandra }
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecret | quote }}
                  key: admin-password
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tls, mountPath: /cql-tls, readOnly: true }
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tlsSecret | quote }}
            items:
              - { key: ca.crt, path: ca.crt }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: greenguard-cassandra-grants
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: { app: greenguard-cassandra-grants, greenguard.io/cassandra-job: "true" }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grants
          image: {{ .Values.cassandraImage | quote }}
          command: ["/bin/sh", "/bootstrap/grants.sh"]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: auth, mountPath: /auth, readOnly: true }
            - { name: tls, mountPath: /cql-tls, readOnly: true }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
      volumes:
        - name: auth
          secret:
            secretName: {{ .Values.authSecret | quote }}
            items:
              - { key: admin-password, path: admin-password }
        - name: tls
          secret:
            secretName: {{ .Values.tlsSecret | quote }}
            items:
              - { key: ca.crt, path: ca.crt }
        - name: bootstrap
          configMap: { name: greenguard-cassandra-bootstrap }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: greenguard-cassandra
spec:
  podSelector:
    matchLabels:
      app: greenguard-cassandra
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              greenguard.io/cassandra-job: "true"
            matchExpressions:
              - key: app
                operator: In
                values: [greenguard-cassandra-bootstrap, greenguard-cassandra-schema, greenguard-cassandra-grants, greenguard-cassandra-activator]
      ports:
        - { protocol: TCP, port: 9042 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: greenguard-cassandra
      ports:
        - { protocol: TCP, port: 7000 }
        - { protocol: TCP, port: 9042 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: greenguard-cassandra-jobs
spec:
  podSelector:
    matchLabels:
      greenguard.io/cassandra-job: "true"
    matchExpressions:
      - key: app
        operator: In
        values: [greenguard-cassandra-bootstrap, greenguard-cassandra-schema, greenguard-cassandra-grants, greenguard-cassandra-activator]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app: greenguard-cassandra
      ports:
        - { protocol: TCP, port: 9042 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: greenguard-cassandra-activator-api
spec:
  podSelector:
    matchLabels:
      app: greenguard-cassandra-activator
      greenguard.io/cassandra-job: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.apiServerCIDR | quote }}
      ports:
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: greenguard-cassandra-clients
spec:
  podSelector:
    matchLabels:
      app: greenguard-cassandra
      greenguard.io/cassandra-auth-ready: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: greenguard
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [read-api, cassandra-writer]
      ports:
        - { protocol: TCP, port: 9042 }
