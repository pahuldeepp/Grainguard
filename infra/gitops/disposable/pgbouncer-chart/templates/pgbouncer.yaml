{{- if not (regexMatch "^[^[:space:]@]+@sha256:[a-f0-9]{64}$" .Values.image) }}{{ fail "PgBouncer image must be an immutable OCI digest" }}{{ end }}
{{- if not (regexMatch "^[a-zA-Z0-9.-]+\\.rds\\.amazonaws\\.com$" .Values.rdsHost) }}{{ fail "rdsHost must be an RDS DNS name" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.authSecret) }}{{ fail "authSecret must be a Kubernetes Secret name" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.caSecret) }}{{ fail "caSecret must be a Kubernetes Secret name" }}{{ end }}
{{- $config := printf `[databases]
greenguard_read = host=%s port=5432 dbname=greenguard_read
greenguard_inventory = host=%s port=5432 dbname=greenguard_inventory
greenguard_telemetry = host=%s port=5432 dbname=greenguard_telemetry
greenguard_risk = host=%s port=5432 dbname=greenguard_risk
greenguard_jobs = host=%s port=5432 dbname=greenguard_jobs
greenguard_notifications = host=%s port=5432 dbname=greenguard_notifications
greenguard_alerts = host=%s port=5432 dbname=greenguard_alerts
greenguard_hardware = host=%s port=5432 dbname=greenguard_hardware
greenguard_sagas = host=%s port=5432 dbname=greenguard_sagas
greenguard_control = host=%s port=5432 dbname=greenguard_control
greenguard_billing = host=%s port=5432 dbname=greenguard_billing

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 10
max_client_conn = 500
server_tls_sslmode = verify-full
server_tls_ca_file = /rds-ca/ca.pem
ignore_startup_parameters = extra_float_digits,options
admin_users =
` .Values.rdsHost .Values.rdsHost .Values.rdsHost .Values.rdsHost .Values.rdsHost .Values.rdsHost .Values.rdsHost .Values.rdsHost .Values.rdsHost .Values.rdsHost .Values.rdsHost }}
{{- $revision := sha256sum (printf "%s\n%s" .Values.image $config) | trunc 12 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: greenguard-pgbouncer-{{ $revision }}
data:
  pgbouncer.ini: |
{{ $config | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
spec:
  type: ClusterIP
  selector: {app: pgbouncer}
  ports:
    - {name: postgres, port: 6432, targetPort: 6432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels: {app: pgbouncer, greenguard.io/lifecycle: disposable}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pgbouncer}
  template:
    metadata:
      labels: {app: pgbouncer, greenguard.io/lifecycle: disposable}
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pgbouncer
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
          ports: [{name: postgres, containerPort: 6432}]
          startupProbe:
            tcpSocket: {port: 6432}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: 6432}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 6432}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/pgbouncer/pgbouncer.ini, subPath: pgbouncer.ini, readOnly: true}
            - {name: auth, mountPath: /run/pgbouncer/userlist.txt, subPath: userlist.txt, readOnly: true}
            - {name: ca, mountPath: /rds-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: greenguard-pgbouncer-{{ $revision }}}
        - name: auth
          secret: {secretName: {{ .Values.authSecret | quote }}}
        - name: ca
          secret: {secretName: {{ .Values.caSecret | quote }}}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
