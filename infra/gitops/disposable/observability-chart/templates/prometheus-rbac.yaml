apiVersion: v1
kind: ServiceAccount
metadata:
  name: greenguard-prometheus
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: greenguard-prometheus-pod-discovery
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: greenguard-prometheus-pod-discovery
subjects:
  - kind: ServiceAccount
    name: greenguard-prometheus
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: greenguard-prometheus-pod-discovery
  apiGroup: rbac.authorization.k8s.io
