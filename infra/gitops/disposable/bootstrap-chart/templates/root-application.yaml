{{- if not (regexMatch "^[a-f0-9]{40}$" .Values.revision) }}{{ fail "revision must be an exact Git commit SHA" }}{{ end }}
{{- if not (hasPrefix "https://" .Values.repositoryUrl) }}{{ fail "repositoryUrl must use HTTPS" }}{{ end }}
{{- if not .Values.cell }}{{ fail "cell is required" }}{{ end }}
{{- $data := .Values.dataPlane | default dict }}
{{- if and (hasKey $data "enabled") (not (kindIs "bool" $data.enabled)) }}{{ fail "dataPlane.enabled must be boolean" }}{{ end }}
{{- if $data.enabled }}
{{- if not (regexMatch "^[a-zA-Z0-9.-]+\\.rds\\.amazonaws\\.com$" ($data.rdsHost | default "")) }}{{ fail "data plane requires an RDS endpoint DNS name" }}{{ end }}
{{- $images := $data.images | default dict }}
{{- if ne (len $images) 4 }}{{ fail "data plane requires exactly four image digests" }}{{ end }}
{{- range (list "pgbouncer" "kafka-topics" "kafka-connect" "connector-registration") }}
{{- if not (regexMatch "^[a-z0-9.-]+(?::[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$" (index $images . | default "")) }}{{ fail (printf "data plane image %s must be an immutable OCI digest" .) }}{{ end }}
{{- end }}
{{- $secrets := $data.secrets | default dict }}
{{- if ne (len $secrets) 3 }}{{ fail "data plane requires exactly three Secret names" }}{{ end }}
{{- range (list "pgbouncerAuth" "rdsCa" "cdcCredentials") }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (index $secrets . | default "")) }}{{ fail (printf "data plane Secret %s is missing or invalid" .) }}{{ end }}
{{- end }}
{{- end }}
{{- $search := .Values.searchPlane | default dict }}
{{- if and (hasKey $search "enabled") (not (kindIs "bool" $search.enabled)) }}{{ fail "searchPlane.enabled must be boolean" }}{{ end }}
{{- if $search.enabled }}
{{- range (list "image" "bootstrapImage") }}
{{- if not (regexMatch "^[a-z0-9.-]+(?::[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$" (index $search . | default "")) }}{{ fail (printf "search plane %s must be an immutable OCI digest" .) }}{{ end }}
{{- end }}
{{- end }}
{{- $cassandra := .Values.cassandraPlane | default dict }}
{{- if and (hasKey $cassandra "enabled") (not (kindIs "bool" $cassandra.enabled)) }}{{ fail "cassandraPlane.enabled must be boolean" }}{{ end }}
{{- if $cassandra.enabled }}
{{- range (list "image" "migratorImage") }}
{{- if not (regexMatch "^[a-z0-9.-]+(?::[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$" (index $cassandra . | default "")) }}{{ fail (printf "Cassandra plane %s must be an immutable OCI digest" .) }}{{ end }}
{{- end }}
{{- if ne ($cassandra.authSecret | default "") "greenguard-cassandra-auth" }}{{ fail "Cassandra auth Secret name drifted" }}{{ end }}
{{- if ne ($cassandra.tlsSecret | default "") "greenguard-cassandra-tls" }}{{ fail "Cassandra TLS Secret name drifted" }}{{ end }}
{{- if not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" ($cassandra.apiServerCIDR | default "")) }}{{ fail "Cassandra API Service needs an exact /32" }}{{ end }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: greenguard-disposable
  namespace: argocd
  labels:
    greenguard.io/cell: {{ .Values.cell | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repositoryUrl | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: infra/gitops/disposable/applications-chart
    helm:
      valuesObject:
        cell: {{ .Values.cell | quote }}
        repositoryUrl: {{ .Values.repositoryUrl | quote }}
        revision: {{ .Values.revision | quote }}
        releases:
{{ toYaml .Values.releases | indent 10 }}
        observabilityImages:
{{ toYaml .Values.observabilityImages | indent 10 }}
        dataPlane:
{{ toYaml .Values.dataPlane | indent 10 }}
        searchPlane:
{{ toYaml .Values.searchPlane | indent 10 }}
        cassandraPlane:
{{ toYaml .Values.cassandraPlane | indent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
