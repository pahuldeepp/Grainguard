apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: greenguard-dex
  labels: {app.kubernetes.io/name: greenguard-managed-dex, greenguard.io/cell: {{ .Values.cell | quote }}}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: greenguard-managed-dex}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: istio-system}
          podSelector:
            matchLabels: {app: istio-ingressgateway}
      ports: [{protocol: TCP, port: 5556}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
{{- range .Values.databaseCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
{{- end }}
      ports: [{protocol: TCP, port: 5432}]
    # The injected Envoy sidecar must reach Istiod for xDS and certificate
    # issuance. Keep the control-plane egress scoped to its namespace/selector.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: istio-system}
          podSelector:
            matchLabels: {app: istiod}
      ports: [{protocol: TCP, port: 15012}]
