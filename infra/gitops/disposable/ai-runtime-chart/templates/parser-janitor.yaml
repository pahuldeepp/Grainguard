{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: ai-parser-janitor, labels: {greenguard.io/cell: {{ .Values.cell | quote }}}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ai-parser-janitor, namespace: greenguard-parser, labels: {greenguard.io/cell: {{ .Values.cell | quote }}}}
rules: [{apiGroups: [""], resources: [pods], verbs: [get, list, delete]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ai-parser-janitor, namespace: greenguard-parser, labels: {greenguard.io/cell: {{ .Values.cell | quote }}}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ai-parser-janitor}
subjects: [{kind: ServiceAccount, name: ai-parser-janitor, namespace: greenguard}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: ai-parser-janitor, labels: {greenguard.io/cell: {{ .Values.cell | quote }}}}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels: {app.kubernetes.io/name: ai-parser-janitor, app.kubernetes.io/part-of: ai-runtime}
          annotations: {sidecar.istio.io/inject: "false"}
        spec:
          restartPolicy: Never
          serviceAccountName: ai-parser-janitor
          nodeSelector: {kubernetes.io/arch: amd64}
          securityContext:
{{ include "ai.security" . | indent 12 }}
          containers:
            - name: janitor
              image: {{ .Values.images.indexer | quote }}
              command:
                - python
                - -c
                - |
                  import json,subprocess
                  base=['kubectl','--request-timeout=15s','-n','greenguard-parser']
                  p=subprocess.run(base+['get','pods','-l','app=knowledge-parser','-o','json'],capture_output=True,text=True,check=True)
                  for pod in json.loads(p.stdout).get('items',[]):
                      meta=pod.get('metadata',{}); spec=pod.get('spec',{})
                      if (pod.get('status',{}).get('phase') not in ('Succeeded','Failed')
                          or spec.get('runtimeClassName')!='greenguard-parser-runsc'
                          or spec.get('serviceAccountName')!='knowledge-parser'
                          or spec.get('automountServiceAccountToken') is not False
                          or not meta.get('name','').startswith('gg-parser-')
                          or not meta.get('uid') or not meta.get('resourceVersion')): continue
                      options={'apiVersion':'v1','kind':'DeleteOptions','preconditions':{'uid':meta['uid'],'resourceVersion':meta['resourceVersion']}}
                      subprocess.run(['kubectl','--request-timeout=15s','delete','--raw','/api/v1/namespaces/greenguard-parser/pods/'+meta['name'],'-f','-'],input=json.dumps(options),text=True,check=True,capture_output=True)
              securityContext:
{{ include "ai.containerSecurity" . | indent 16 }}
              resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
              volumeMounts: [{name: scratch, mountPath: /tmp}]
          volumes: [{name: scratch, emptyDir: {medium: Memory, sizeLimit: 16Mi}}]
{{- end }}
