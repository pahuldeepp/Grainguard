{{- if not (regexMatch "^[^[:space:]@]+@sha256:[a-f0-9]{64}$" .Values.image) }}{{ fail "registration image must be an immutable OCI digest" }}{{ end }}
{{- if not (regexMatch "^[a-zA-Z0-9.-]+\\.[a-zA-Z0-9.-]+$" .Values.rdsHost) }}{{ fail "rdsHost must be an RDS DNS hostname" }}{{ end }}
{{- $script := .Files.Get "files/register.py" }}
{{- $files := .Files.Glob "files/connectors/*.json" }}
{{- if ne (len $files) 8 }}{{ fail "exactly eight pinned connector configs are required" }}{{ end }}
{{- $revision := sha256sum (printf "%s\n%s\n%s\n%s" .Values.image .Values.rdsHost $script ($files.AsConfig | toString)) | trunc 12 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: connector-registration-{{ $revision }}
data:
  register.py: |
{{ $script | indent 4 }}
{{- range $path, $_ := $files }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: connector-registration-{{ $revision }}
  labels: {greenguard.io/lifecycle: disposable}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app: connector-registration, greenguard.io/lifecycle: disposable}
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: register
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python3", "/registration/register.py"]
          env:
            - {name: RDS_HOST, value: {{ .Values.rdsHost | quote }}}
            - {name: CONNECT_URL, value: {{ .Values.connectUrl | quote }}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: registration, mountPath: /registration, readOnly: true}
      volumes:
        - name: registration
          configMap:
            name: connector-registration-{{ $revision }}
            items:
              - {key: register.py, path: register.py}
{{- range $path, $_ := $files }}
              - {key: {{ base $path }}, path: connectors/{{ base $path }}}
{{- end }}
