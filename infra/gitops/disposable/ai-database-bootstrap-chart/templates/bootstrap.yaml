{{- if .Values.enabled }}
{{- if ne .Values.image "postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea" }}{{ fail "AI database bootstrap image must use the reviewed pinned PostgreSQL image" }}{{ end }}
{{- if not (regexMatch "^[a-zA-Z0-9.-]+\\.rds\\.amazonaws\\.com$" (.Values.rdsHost | default "")) }}{{ fail "AI bootstrap requires the exact disposable central RDS endpoint" }}{{ end }}
{{- if not (and (kindIs "slice" .Values.rdsCIDRs) (gt (len .Values.rdsCIDRs) 0) (le (len .Values.rdsCIDRs) 6)) }}{{ fail "AI bootstrap requires bounded RDS network CIDRs" }}{{ end }}
{{- range .Values.rdsCIDRs }}{{ if not (regexMatch "^(10\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}|172\\.(1[6-9]|2[0-9]|3[01])\\.[0-9]{1,3}\\.[0-9]{1,3}|192\\.168\\.[0-9]{1,3}\\.[0-9]{1,3})/(1[6-9]|2[0-9]|3[0-2])$" .) }}{{ fail "AI bootstrap CIDRs must be private IPv4 ranges" }}{{ end }}{{ end }}
{{- range list .Values.adminSecret .Values.roleSecret .Values.caSecret }}{{ if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .) }}{{ fail "AI bootstrap Secret names must be valid Kubernetes names" }}{{ end }}{{ end }}
{{- $revision := sha256sum (printf "%s|%s|%s|%s" .Values.rdsHost .Values.adminSecret .Values.roleSecret .Values.image) | trunc 12 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-{{ $revision }}
data:
  ai-databases.sql: |
{{ .Files.Get "files/ai-databases.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}-{{ $revision }}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      annotations: {sidecar.istio.io/inject: "false"}
      labels: {greenguard.io/ai-database-bootstrap: "true"}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [psql]
          args: ["-X", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap/ai-databases.sql"]
          envFrom:
            - secretRef: {name: {{ .Values.adminSecret | quote }} }
            - secretRef: {name: {{ .Values.roleSecret | quote }} }
          env:
            - {name: PGHOST, value: {{ .Values.rdsHost | quote }} }
            - {name: PGUSER, value: greenguard_admin}
            - {name: PGDATABASE, value: postgres}
            - {name: PGPORT, value: "5432"}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /rds-ca/ca.pem}
            - {name: PGCONNECT_TIMEOUT, value: "10"}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: sql, mountPath: /bootstrap, readOnly: true}
            - {name: ca, mountPath: /rds-ca, readOnly: true}
      volumes:
        - name: sql
          configMap: {name: {{ .Values.name }}-{{ $revision }} }
        - name: ca
          secret:
            secretName: {{ .Values.caSecret | quote }}
            items: [{key: ca.pem, path: ca.pem}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-egress
spec:
  podSelector:
    matchLabels: {greenguard.io/ai-database-bootstrap: "true"}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
{{- range .Values.rdsCIDRs }}
        - ipBlock: {cidr: {{ . | quote }} }
{{- end }}
      ports: [{protocol: TCP, port: 5432}]
{{- end }}
