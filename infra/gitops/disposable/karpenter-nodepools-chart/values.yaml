# Every value is supplied by infra/terraform/disposable/karpenter.tf.
cell: ""
environment: ""
instanceProfile: ""
# Pinned EKS-optimized AL2023 release, for example al2023@v20261001.
amiAlias: ""
zones: []
instanceFamilies: []
# Release images are built for linux/amd64 only (.github/workflows/ci.yml).
arch: amd64
# Largest instance is 4 vCPUs; preflight reserves at least one per enabled pool.
instanceCpus: ["2", "4"]
expireAfter: 168h
terminationGracePeriod: 15m
consolidateAfter: 5m
rootVolumeSize: 80Gi
pools:
  compute:
    cpuLimit: 0
  general:
    cpuLimit: 0
