{{- $v := .Values -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $v.name }}-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $v.name | quote }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
{{- range .Values.rdsCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
{{- end }}
      ports: [{protocol: TCP, port: 5432}]
