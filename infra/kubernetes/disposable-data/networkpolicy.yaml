apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: disposable-rabbitmq-ingress
  namespace: greenguard
spec:
  podSelector:
    matchLabels: {app: rabbitmq}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 5672}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: disposable-redis-ingress
  namespace: greenguard
spec:
  podSelector:
    matchLabels: {app: redis-cluster}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 6379}
    - from:
        - podSelector:
            matchLabels: {app: redis-cluster}
      ports:
        - {protocol: TCP, port: 16379}
