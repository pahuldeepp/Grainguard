apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: greenguard
spec:
  clusterIP: None
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: greenguard
spec:
  type: ClusterIP
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: greenguard
  labels: {app: rabbitmq, greenguard.io/lifecycle: disposable}
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq, greenguard.io/lifecycle: disposable}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        greenguard.io/workload-class: general
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2-alpine@sha256:b5c3420a9bf1066be2a01edf5bafbe846fc7a23e9f7cc5b36c04421d1eeb5af0
          imagePullPolicy: IfNotPresent
          env:
            - {name: RABBITMQ_USE_LONGNAME, value: "true"}
            - {name: RABBITMQ_NODENAME, value: "rabbit@rabbitmq-0.rabbitmq-headless.greenguard.svc.cluster.local"}
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {secretKeyRef: {name: greenguard-data-credentials, key: RABBITMQ_DEFAULT_USER}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: greenguard-data-credentials, key: RABBITMQ_DEFAULT_PASS}}
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom: {secretKeyRef: {name: greenguard-data-credentials, key: RABBITMQ_ERLANG_COOKIE}}
          ports:
            - {name: amqp, containerPort: 5672}
          startupProbe:
            exec: {command: [rabbitmq-diagnostics, -q, check_port_connectivity]}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, check_port_connectivity]}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: rabbitmq-data, mountPath: /var/lib/rabbitmq}
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
        labels: {greenguard.io/lifecycle: disposable}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: greenguard-disposable-gp3
        resources:
          requests: {storage: 8Gi}
