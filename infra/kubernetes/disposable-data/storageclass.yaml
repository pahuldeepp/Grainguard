apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: greenguard-disposable-gp3
  labels:
    app.kubernetes.io/part-of: greenguard
    greenguard.io/lifecycle: disposable
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
