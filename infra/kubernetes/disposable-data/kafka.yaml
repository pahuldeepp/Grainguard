apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: greenguard
spec:
  clusterIP: None
  selector: {app: kafka}
  ports:
    - {name: broker, port: 29092, targetPort: 29092}
    - {name: controller, port: 9093, targetPort: 9093}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: greenguard
spec:
  type: ClusterIP
  selector: {app: kafka}
  ports:
    - {name: broker, port: 29092, targetPort: 29092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: greenguard
  labels: {app: kafka, greenguard.io/lifecycle: disposable}
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka, greenguard.io/lifecycle: disposable}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        greenguard.io/workload-class: general
      containers:
        - name: kafka
          image: apache/kafka@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
          imagePullPolicy: IfNotPresent
          env:
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka-headless.greenguard.svc.cluster.local:9093"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:29092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka-0.kafka-headless.greenguard.svc.cluster.local:29092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:SASL_SSL,CONTROLLER:SASL_SSL"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_AUTHORIZER_CLASS_NAME, value: org.apache.kafka.metadata.authorizer.StandardAuthorizer}
            - {name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND, value: "false"}
            - {name: KAFKA_SUPER_USERS, value: "User:broker;User:admin"}
            - {name: KAFKA_SASL_ENABLED_MECHANISMS, value: PLAIN}
            - {name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL, value: PLAIN}
            - {name: KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL, value: PLAIN}
            - name: KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG
              valueFrom: {secretKeyRef: {name: greenguard-kafka-auth, key: broker-jaas}}
            - name: KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG
              valueFrom: {secretKeyRef: {name: greenguard-kafka-auth, key: broker-jaas}}
            - {name: KAFKA_SSL_KEYSTORE_LOCATION, value: /etc/greenguard/kafka/broker.keystore.p12}
            - {name: KAFKA_SSL_KEYSTORE_TYPE, value: PKCS12}
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom: {secretKeyRef: {name: greenguard-kafka-auth, key: keystore-password}}
            - name: KAFKA_SSL_KEY_PASSWORD
              valueFrom: {secretKeyRef: {name: greenguard-kafka-auth, key: key-password}}
            - {name: KAFKA_SSL_TRUSTSTORE_LOCATION, value: /etc/greenguard/kafka/broker.truststore.p12}
            - {name: KAFKA_SSL_TRUSTSTORE_TYPE, value: PKCS12}
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom: {secretKeyRef: {name: greenguard-kafka-auth, key: truststore-password}}
            - {name: KAFKA_SSL_CLIENT_AUTH, value: none}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_MIN_INSYNC_REPLICAS, value: "1"}
            - {name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
          ports:
            - {name: broker, containerPort: 29092}
            - {name: controller, containerPort: 9093}
          startupProbe:
            tcpSocket: {port: 29092}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: 29092}
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: 29092}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: kafka-data, mountPath: /var/lib/kafka/data}
            - {name: kafka-tls, mountPath: /etc/greenguard/kafka, readOnly: true}
            - {name: kafka-tmp, mountPath: /tmp}
      volumes:
        - name: kafka-tls
          secret:
            secretName: greenguard-kafka-auth
            defaultMode: 0440
            items:
              - {key: broker.keystore.p12, path: broker.keystore.p12}
              - {key: broker.truststore.p12, path: broker.truststore.p12}
        - name: kafka-tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels: {greenguard.io/lifecycle: disposable}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: greenguard-disposable-gp3
        resources:
          requests: {storage: 16Gi}
