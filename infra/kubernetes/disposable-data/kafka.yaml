apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: greenguard
spec:
  clusterIP: None
  selector: {app: kafka}
  ports:
    - {name: broker, port: 29092, targetPort: 29092}
    - {name: controller, port: 9093, targetPort: 9093}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: greenguard
spec:
  type: ClusterIP
  selector: {app: kafka}
  ports:
    - {name: broker, port: 29092, targetPort: 29092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: greenguard
  labels: {app: kafka, greenguard.io/lifecycle: disposable}
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka, greenguard.io/lifecycle: disposable}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        greenguard.io/workload-class: general
      containers:
        - name: kafka
          image: apache/kafka@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
          imagePullPolicy: IfNotPresent
          env:
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka-headless.greenguard.svc.cluster.local:9093"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:29092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka-0.kafka-headless.greenguard.svc.cluster.local:29092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_MIN_INSYNC_REPLICAS, value: "1"}
            - {name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
          ports:
            - {name: broker, containerPort: 29092}
            - {name: controller, containerPort: 9093}
          startupProbe:
            exec: {command: [/opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:29092, --list]}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: {command: [/opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:29092, --list]}
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: 29092}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: kafka-data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels: {greenguard.io/lifecycle: disposable}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: greenguard-disposable-gp3
        resources:
          requests: {storage: 16Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: greenguard
spec:
  type: ClusterIP
  selector: {app: schema-registry}
  ports:
    - {name: http, port: 8081, targetPort: 8081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: greenguard
  labels: {app: schema-registry, greenguard.io/lifecycle: disposable}
spec:
  replicas: 1
  selector:
    matchLabels: {app: schema-registry}
  template:
    metadata:
      labels: {app: schema-registry, greenguard.io/lifecycle: disposable}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        greenguard.io/workload-class: general
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry@sha256:c02aa3d6409caea9ee707c7dfc98990460f7ee5e9c5535942a3279d8264fe0d1
          imagePullPolicy: IfNotPresent
          env:
            - {name: SCHEMA_REGISTRY_HOST_NAME, value: schema-registry}
            - {name: SCHEMA_REGISTRY_LISTENERS, value: "http://0.0.0.0:8081"}
            - {name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, value: "PLAINTEXT://kafka.greenguard.svc.cluster.local:29092"}
            - {name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: SCHEMA_REGISTRY_HEAP_OPTS, value: "-Xms128m -Xmx384m"}
          ports:
            - {name: http, containerPort: 8081}
          startupProbe:
            httpGet: {path: /subjects, port: 8081}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /subjects, port: 8081}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /subjects, port: 8081}
            periodSeconds: 30
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
