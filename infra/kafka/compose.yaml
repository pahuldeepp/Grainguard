# Opt-in overlay: never loaded by make dev / verify / smoke.
services:
  hardware-worker:
    image: ${IMAGE_PREFIX:-grainguard}/hardware-worker:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: services/hardware-service/Dockerfile
    environment:
      HARDWARE_DATABASE_URL: postgresql://hardware_app:${HARDWARE_DB_PASSWORD:?Run make bootstrap}@pgbouncer:6432/greenguard_hardware
      KAFKA_BROKERS: kafka:29092
      MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      postgres: {condition: service_healthy}
      pgbouncer: {condition: service_healthy}
      kafka: {condition: service_healthy}
      mosquitto: {condition: service_started}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: unless-stopped
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports: ["127.0.0.1:${MQTT_HOST_PORT:-51883}:1883"]
    volumes:
      - ../mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped
  kafka:
    # apache/kafka:3.9.1; index digest, pulled and verified locally.
    image: apache/kafka@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    ports: ["127.0.0.1:${KAFKA_HOST_PORT:-59092}:9092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:${KAFKA_HOST_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
  schema-registry:
    # confluentinc/cp-schema-registry:7.9.1; index digest, pulled and verified locally.
    image: confluentinc/cp-schema-registry@sha256:c02aa3d6409caea9ee707c7dfc98990460f7ee5e9c5535942a3279d8264fe0d1
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["127.0.0.1:${SCHEMA_REGISTRY_HOST_PORT:-58081}:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx384m
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  connect:
    image: ${IMAGE_PREFIX:-grainguard}/debezium-connect-avro:3.2.0-local
    build:
      context: ../..
      dockerfile: infra/kafka/Dockerfile.connect
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    ports: ["127.0.0.1:${KAFKA_CONNECT_HOST_PORT:-58083}:8083"]
    environment:
      JMXPORT: 9404
      # RMI advertises this hostname in the stub returned to the exporter.
      # Use the Compose service DNS name; 0.0.0.0 is a bind address, not a
      # reachable hostname, and causes the JMX exporter to get connection refused.
      JMXHOST: connect
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: greenguard-connect
      CONFIG_STORAGE_TOPIC: greenguard.connect.configs
      OFFSET_STORAGE_TOPIC: greenguard.connect.offsets
      STATUS_STORAGE_TOPIC: greenguard.connect.status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_PARTITIONS: 1
      CONNECT_STATUS_STORAGE_PARTITIONS: 1
      CONNECT_TOPIC_CREATION_ENABLE: "false"
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: CDC_DB_PASSWORD|SCHEMA_REGISTRY_URL
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PRODUCER_ACKS: all
      OFFSET_FLUSH_INTERVAL_MS: 1000
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:?Run make bootstrap}
      HEAP_OPTS: -Xms256m -Xmx768m
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  connect-jmx-exporter:
    image: bitnami/jmx-exporter@sha256:8ceb602e43c970c0484b78d44fb2d65b04ab3ecdd701cc8b1a3f8e4aa4a12915
    command: ["9405", "/etc/jmx-exporter/config.yaml"]
    volumes:
      - ../kafka/jmx-exporter/connect.yaml:/etc/jmx-exporter/config.yaml:ro
    depends_on:
      connect: { condition: service_healthy }
    ports: ["127.0.0.1:19405:9405"]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9405/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  streaming-state-exporter:
    image: node:22-alpine
    working_dir: /app
    command: [node, exporters/streaming-state-exporter.mjs]
    environment:
      CONNECT_URL: http://connect:8083
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PORT: 9309
    volumes:
      - ../observability/exporters/streaming-state-exporter.mjs:/app/exporters/streaming-state-exporter.mjs:ro
    depends_on:
      connect: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    ports: ["127.0.0.1:19309:9309"]
    restart: unless-stopped
  kafka-exporter:
    image: danielqsj/kafka-exporter@sha256:4150e46b2e9697ac30e4be8de03ec1704b4bdc7037577b83b8d35a32be298c16
    command: [--kafka.server=kafka:29092, --web.listen-address=:9308]
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["127.0.0.1:19308:9308"]
    restart: unless-stopped
volumes:
  mosquitto-data:
  kafka-data:
