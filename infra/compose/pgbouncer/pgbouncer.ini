[databases]
greenguard_read = host=postgres port=5432 dbname=greenguard_read
greenguard_inventory = host=postgres port=5432 dbname=greenguard_inventory
greenguard_telemetry = host=postgres port=5432 dbname=greenguard_telemetry
greenguard_risk = host=postgres port=5432 dbname=greenguard_risk
greenguard_jobs = host=postgres port=5432 dbname=greenguard_jobs
greenguard_notifications = host=postgres port=5432 dbname=greenguard_notifications
greenguard_alerts = host=postgres port=5432 dbname=greenguard_alerts
greenguard_hardware = host=postgres port=5432 dbname=greenguard_hardware
greenguard_sagas = host=postgres port=5432 dbname=greenguard_sagas
greenguard_control = host=postgres port=5432 dbname=greenguard_control
greenguard_billing = host=postgres port=5432 dbname=greenguard_billing

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt
; Transaction pooling: tenant context must be set with set_config(..., true) inside each transaction.
pool_mode = transaction
default_pool_size = 10
max_client_conn = 500
server_reset_query_always = 1
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options
admin_users =
