- rule: GreenGuard Noninteractive Shell Spawned in Application Container
  desc: Detect noninteractive shell execution in the GreenGuard application namespace.
  condition: >
    spawned_process and container and k8s.ns.name = greenguard and
    proc.tty = 0 and
    proc.name in (sh, bash, dash, ash, zsh, ksh, csh, tcsh, fish, pwsh)
  output: >
    GreenGuard runtime alert: shell spawned in application container |
    namespace=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository process=%proc.name parent=%proc.pname
    uid=%user.uid
  priority: WARNING
  tags: [greenguard, runtime, process, mitre_execution]

- rule: GreenGuard Container Accessed AWS Instance Metadata
  desc: Detect a container process attempting to connect to the EC2 instance metadata endpoint.
  condition: >
    evt.type = connect and container and k8s.ns.name = greenguard and
    fd.rip = 169.254.169.254
  output: >
    GreenGuard runtime alert: container attempted AWS metadata access |
    namespace=%k8s.ns.name pod=%k8s.pod.name container=%container.name
    image=%container.image.repository process=%proc.name
    remote_ip=%fd.rip remote_port=%fd.rport uid=%user.uid
  priority: WARNING
  tags: [greenguard, runtime, network, mitre_credential_access]
