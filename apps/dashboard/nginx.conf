server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  location /api/devices/ { proxy_pass http://device-service:3001/; }
  location /api/telemetry/ { proxy_pass http://telemetry-ingest:8080/; }
  location / { try_files $uri $uri/ /index.html; }
}
