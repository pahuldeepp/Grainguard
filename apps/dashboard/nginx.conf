# GreenGuard dashboard: static SPA + same-origin reverse proxy to the gateway/BFF.
# Rendered by the nginx image entrypoint (envsubst) from
# /etc/nginx/templates/default.conf.template. The only substituted variable is
# CSP_CONNECT_EXTRA (space-separated extra connect-src origins: the OIDC issuer
# origin, plus a Sentry ingest origin when VITE_SENTRY_DSN is used). See
# docs/DASHBOARD_DELIVERY.md.
server_tokens off;

# Long-lived caching only for content-hashed build output. Not "always": error
# responses (for example a 404 for a stale hashed asset) must never get it.
map $uri $gg_cache_control {
  default                                                      "no-cache";
  ~^/assets/                                                   "public, max-age=31536000, immutable";
  ~^/(favicon\.svg|apple-touch-icon\.png|icon-\d+\.png|site\.webmanifest)$ "public, max-age=86400";
  ~^/(graphql$|api/|config\.json$)                             "no-store";
}

# HSTS only when a TLS-terminating proxy in front says the client used https.
# Plain HTTP (local, staging on 127.0.0.1) never gets it.
map $http_x_forwarded_proto $gg_hsts {
  default "";
  https   "max-age=31536000";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # Security headers (server level; no location below sets add_header, so all
  # of them are inherited everywhere, including proxied and error responses).
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${CSP_CONNECT_EXTRA}; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security $gg_hsts always;
  add_header Cache-Control $gg_cache_control;

  # Compression (gzip only: the stock image has no brotli module, and no
  # brotli directive is emitted so nginx -t stays valid). JSON is excluded on
  # purpose (BREACH exposure for token-bearing responses).
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript image/svg+xml application/manifest+json text/plain;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/devices/ { proxy_pass http://device-service:3001/; }
  location /api/telemetry/ { proxy_pass http://telemetry-ingest:8080/; }
  location = /graphql {
    proxy_pass http://gateway:4002/graphql;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 3600s;
  }
  location = /api/v1/subscription-ticket { proxy_pass http://gateway:4002/api/v1/subscription-ticket; }
  location ^~ /v1/assistant/ {
    client_max_body_size 25m;
    proxy_pass http://gateway:4002;
    # Complete-summary client requests have a bounded 320s deadline.
    proxy_read_timeout 330s;
  }
  location ^~ /v1/rag/ {
    proxy_pass http://gateway:4002;
    proxy_read_timeout 130s;
  }
  location ^~ /v1/advisor/ {
    proxy_pass http://gateway:4002;
    proxy_read_timeout 130s;
  }

  # Build output and any other file-like path: a missing file is a real 404,
  # never index.html (that would mask a stale hashed asset as broken JS/CSS).
  location /assets/ { try_files $uri =404; }
  location = /site.webmanifest { default_type application/manifest+json; try_files $uri =404; }
  location ~ "\.[A-Za-z0-9]{1,8}$" { try_files $uri =404; }

  # Client-side routes (for example /auth/callback) fall back to the shell.
  location / { try_files $uri /index.html; }
}
